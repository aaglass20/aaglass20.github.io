<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balance — what we pay for &amp; why</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Sign-in -->
  <section id="login" class="login hidden">
    <div class="login-card">
      <h1>⚖️ Balance</h1>
      <p class="muted">Recurring charges, the reasons we pay for them, and where the money leaks.</p>
      <form id="loginForm">
        <label class="field">Email
          <input type="email" name="email" required autocomplete="email" placeholder="you@example.com">
        </label>
        <button class="btn primary block" type="submit">Email me a sign-in link</button>
      </form>
      <p id="loginMsg" class="muted small"></p>
      <hr>
      <button class="btn block" id="demoBtn">Try it with sample data</button>
      <p class="muted small">Sample mode lives only in this browser — nothing is sent to the cloud.</p>
    </div>
  </section>

  <!-- App -->
  <div id="app" class="hidden">
    <header class="topbar">
      <div class="brand">
        <h1>⚖️ Balance</h1>
        <span id="syncIndicator" class="sync-indicator idle" title="Cloud sync ready"></span>
        <span id="modeBadge" class="mode-badge hidden">Sample data</span>
      </div>
      <nav class="tabs" role="tablist">
        <button data-tab="dashboard" class="active">Dashboard</button>
        <button data-tab="timeline">Timeline</button>
        <button data-tab="month">Month</button>
        <button data-tab="recurring">Recurring</button>
        <button data-tab="spending">Spending</button>
        <button data-tab="review">Review</button>
      </nav>
      <div class="actions">
        <button class="btn primary" id="addRecurringBtn">+ Recurring</button>
        <button class="btn" id="addSpendBtn">+ Spend</button>
        <button class="btn ghost" id="signOutBtn" title="Sign out">⎋</button>
      </div>
    </header>

    <div id="banner" class="banner hidden"></div>

    <main>
      <section id="tab-dashboard" class="tab active"></section>
      <section id="tab-timeline" class="tab"></section>
      <section id="tab-month" class="tab"></section>
      <section id="tab-recurring" class="tab"></section>
      <section id="tab-spending" class="tab"></section>
      <section id="tab-review" class="tab"></section>
    </main>
  </div>

  <div id="tooltip" class="tooltip hidden" role="tooltip"></div>

  <!-- Recurring editor -->
  <dialog id="recDialog" class="modal">
    <form id="recForm" method="dialog">
      <header class="modal-head">
        <h3 id="recTitle">Recurring charge</h3>
        <button type="button" class="icon-btn" data-close aria-label="Close">&times;</button>
      </header>
      <div class="modal-body">
        <fieldset>
          <legend>The charge</legend>
          <div class="grid2">
            <label class="field">Name <input name="name" required></label>
            <label class="field">Category <select name="category"></select></label>
            <label class="field">Amount ($) <input name="amount" type="number" step="0.01" min="0" required></label>
            <label class="field">Every <select name="cadence">
              <option value="weekly">Week</option><option value="monthly" selected>Month</option>
              <option value="quarterly">Quarter</option><option value="yearly">Year</option></select></label>
            <label class="field">A billing date <input name="anchor_date" type="date" required>
              <span class="hint">Any real charge date — the rest are calculated</span></label>
            <label class="field">Previous price ($) <input name="prev_amount" type="number" step="0.01" min="0">
              <span class="hint">Catches price hikes</span></label>
          </div>
        </fieldset>
        <fieldset>
          <legend>Is it worth it?</legend>
          <label class="field">Why we pay for it <textarea name="justification" rows="2" placeholder="e.g. Family movie night, kids' shows"></textarea></label>
          <label class="field">What we actually use / watch <textarea name="uses" rows="2" placeholder="e.g. Stranger Things, Bluey"></textarea></label>
          <div class="grid3">
            <label class="field">Worth (1–5) <select name="worth"><option value="">—</option>
              <option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label>
            <label class="field">Verdict <select name="verdict"></select></label>
            <label class="field">Last used <input name="last_used" type="date"></label>
          </div>
          <label class="field">Who uses it <input name="who" placeholder="Everyone, kids, me…"></label>
        </fieldset>
        <fieldset>
          <legend>Key dates</legend>
          <div class="grid2">
            <label class="field">Cancel by <input name="cancel_by" type="date"><span class="hint">Reminder to decide before this</span></label>
            <label class="field">Renewal / contract date <input name="renewal_date" type="date"></label>
            <label class="field">Promo price ends <input name="promo_end_date" type="date"></label>
            <label class="field">Price after promo ($) <input name="promo_amount" type="number" step="0.01" min="0"></label>
            <label class="field">Payments end (payoff) <input name="end_date" type="date"><span class="hint">When this charge should drop off</span></label>
            <label class="field">First charge <input name="start_date" type="date"></label>
          </div>
        </fieldset>
        <fieldset>
          <legend>Status</legend>
          <div class="grid3">
            <label class="field">Status <select name="status"><option value="active">Active</option>
              <option value="paused">Paused</option><option value="cancelled">Cancelled</option></select></label>
            <label class="field">Paused until <input name="paused_until" type="date"></label>
            <label class="field">Cancelled on <input name="cancelled_on" type="date"></label>
          </div>
          <label class="field">Cancel / manage link <input name="cancel_url" type="url" placeholder="https://…"></label>
          <label class="field">Notes <textarea name="notes" rows="2"></textarea></label>
        </fieldset>
      </div>
      <footer class="modal-foot">
        <button type="button" class="btn danger" id="recDelete">Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </footer>
    </form>
  </dialog>

  <!-- Spend editor -->
  <dialog id="spendDialog" class="modal small">
    <form id="spendForm" method="dialog">
      <header class="modal-head">
        <h3 id="spendTitle">Log spending</h3>
        <button type="button" class="icon-btn" data-close aria-label="Close">&times;</button>
      </header>
      <div class="modal-body">
        <div class="chip-row" id="spendCatChips"></div>
        <input type="hidden" name="category" value="restaurants">
        <div class="grid2">
          <label class="field">Amount ($) <input name="amount" type="number" step="0.01" min="0" required inputmode="decimal"></label>
          <label class="field">Date <input name="spent_on" type="date" required></label>
        </div>
        <label class="field">Where / what <input name="merchant" placeholder="Chipotle, brewery, Target…"></label>
        <div class="field">Worth it?
          <div class="seg" id="worthSeg">
            <button type="button" data-v="yes">👍 Yes</button>
            <button type="button" data-v="meh">😐 Meh</button>
            <button type="button" data-v="no">👎 No</button>
          </div>
          <input type="hidden" name="worth_it">
        </div>
        <label class="field">Note <input name="note"></label>
      </div>
      <footer class="modal-foot">
        <button type="button" class="btn danger" id="spendDelete">Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </footer>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
