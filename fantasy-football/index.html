<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fantasy Football Tiers — PPR Draft Board</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --tier1: #1a7a2e;
      --tier2: #2980b9;
      --tier3: #8e44ad;
      --tier4: #7f8c8d;
      --tier5: #d35400;
      --tier6: #95a5a6;
      --accent: #00d4aa;
    }
    body { background: #0d1117; color: #e6edf3; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

    /* Hero */
    .hero {
      background: linear-gradient(135deg, #0d1f0d 0%, #0a1f2e 50%, #1a1a2e 100%);
      padding: 2.5rem 1rem; text-align: center; border-bottom: 3px solid var(--accent);
    }
    .hero h1 { font-weight: 800; letter-spacing: -0.5px; }
    .hero .subtitle { color: #8b949e; font-size: 1rem; }
    .last-updated { color: var(--accent); font-size: 0.85rem; margin-top: 0.5rem; }

    /* Draft Bar */
    .draft-bar {
      background: #161b22; border-bottom: 1px solid #30363d;
      padding: 0.6rem 1rem; display: flex; align-items: center;
      gap: 0.75rem; flex-wrap: wrap; position: sticky; top: 0; z-index: 100;
    }
    .draft-bar-label { color: #8b949e; font-size: 0.85rem; white-space: nowrap; }
    .draft-session-input {
      background: #0d1117; border: 1px solid #30363d; color: #e6edf3;
      border-radius: 6px; padding: 0.3rem 0.6rem; font-size: 0.85rem; width: 160px;
    }
    .draft-session-input:focus { outline: none; border-color: var(--accent); }
    .draft-bar-btn {
      background: #21262d; border: 1px solid #30363d; color: #e6edf3;
      border-radius: 6px; padding: 0.3rem 0.75rem; font-size: 0.82rem;
      cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .draft-bar-btn:hover { background: #30363d; border-color: var(--accent); }
    .draft-bar-btn.danger { border-color: #e94560; color: #e94560; }
    .draft-bar-btn.danger:hover { background: rgba(233,69,96,0.12); }
    .draft-count-badge {
      background: var(--accent); color: #000;
      border-radius: 20px; padding: 0.25rem 0.75rem;
      font-size: 0.82rem; font-weight: 700; white-space: nowrap;
    }
    .my-team-badge {
      background: rgba(0,212,170,0.15); color: var(--accent);
      border: 1px solid rgba(0,212,170,0.4); border-radius: 20px;
      padding: 0.25rem 0.75rem; font-size: 0.82rem; font-weight: 700; white-space: nowrap;
    }
    .draft-status { color: #8b949e; font-size: 0.8rem; font-style: italic; }

    /* Nav pills */
    .nav-pills .nav-link {
      color: #8b949e; border: 1px solid #30363d; margin: 3px;
      border-radius: 8px; font-weight: 600; font-size: 0.9rem; transition: all 0.2s;
    }
    .nav-pills .nav-link:hover { color: #e6edf3; border-color: var(--accent); }
    .nav-pills .nav-link.active { background: var(--accent); border-color: var(--accent); color: #000; }
    .position-icon { font-size: 1.1rem; margin-right: 4px; }

    /* Tier cards */
    .tier-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; margin-bottom: 1rem; overflow: hidden; }
    .tier-header { padding: 0.75rem 1rem; font-weight: 700; font-size: 1rem; border-left: 4px solid; }
    .tier-1 .tier-header { border-color: var(--tier1); background: rgba(26,122,46,0.1); color: #3fb950; }
    .tier-2 .tier-header { border-color: var(--tier2); background: rgba(41,128,185,0.1); color: #58a6ff; }
    .tier-3 .tier-header { border-color: var(--tier3); background: rgba(142,68,173,0.1); color: #bc8cff; }
    .tier-4 .tier-header { border-color: var(--tier4); background: rgba(127,140,141,0.1); color: #8b949e; }
    .tier-5 .tier-header { border-color: var(--tier5); background: rgba(211,84,0,0.1); color: #f0883e; }
    .tier-6 .tier-header { border-color: var(--tier6); background: rgba(149,165,166,0.1); color: #8b949e; }

    .player-list { padding: 0.5rem 1rem 0.75rem; }
    .player {
      display: inline-block; background: #0d1117; border: 1px solid #30363d;
      border-radius: 6px; padding: 0.35rem 0.7rem; margin: 3px; font-size: 0.88rem;
      transition: all 0.15s; cursor: pointer; user-select: none;
    }
    .player:hover { border-color: var(--accent); transform: translateY(-1px); }
    .player.sleeper { border-color: #f0883e; background: rgba(240,136,62,0.08); }
    .player.sleeper::after { content: " 🔥"; font-size: 0.8rem; }
    .player.rookie  { border-color: #bc8cff; }
    .player.drafted {
      opacity: 0.25; text-decoration: line-through;
      border-color: #21262d !important; background: #0d1117 !important; transform: none !important;
    }
    .player.drafted:hover { opacity: 0.38; transform: none; }
    .player.mine {
      border-color: var(--accent) !important;
      background: rgba(0,212,170,0.08) !important;
      transform: none !important; opacity: 1 !important; text-decoration: none !important;
    }
    .player.mine::before { content: "⭐ "; font-size: 0.75rem; }
    .player.mine:hover { background: rgba(0,212,170,0.14) !important; }

    /* Badges */
    .rookie-badge {
      display: inline-block; background: rgba(188,140,255,0.25); color: #bc8cff;
      border-radius: 3px; padding: 0 4px; font-size: 0.65rem; font-weight: 700;
      margin-left: 4px; vertical-align: middle; letter-spacing: 0.3px;
    }
    .bye-badge {
      display: inline-block; background: rgba(127,140,141,0.2); color: #8b949e;
      border-radius: 3px; padding: 0 4px; font-size: 0.65rem; font-weight: 700;
      margin-left: 4px; vertical-align: middle;
    }
    .injury-badge {
      display: inline-block; background: rgba(233,69,96,0.2); color: #e94560;
      border-radius: 3px; padding: 0 4px; font-size: 0.65rem; font-weight: 700;
      margin-left: 3px; vertical-align: middle;
    }

    .sleeper-box { background: rgba(240,136,62,0.08); border: 1px solid #f0883e; border-radius: 8px; padding: 0.6rem 1rem; margin-top: 0.5rem; font-size: 0.9rem; }
    .note-box { background: rgba(0,212,170,0.06); border: 1px solid var(--accent); border-radius: 8px; padding: 0.6rem 1rem; margin-bottom: 1rem; font-size: 0.9rem; color: var(--accent); }

    /* Notes tab */
    .callout-section { margin-bottom: 1.5rem; }
    .callout-section h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.75rem; padding-bottom: 0.4rem; border-bottom: 1px solid #30363d; }
    .bust-card { display: inline-block; background: rgba(233,69,96,0.08); border: 1px solid #e94560; border-radius: 6px; padding: 0.4rem 0.75rem; margin: 3px; font-size: 0.88rem; }
    .bust-card .bust-name { font-weight: 600; }
    .bust-card .bust-detail { color: #8b949e; font-size: 0.8rem; }
    .sleeper-card { display: inline-block; background: rgba(63,185,80,0.08); border: 1px solid #3fb950; border-radius: 6px; padding: 0.4rem 0.75rem; margin: 3px; font-size: 0.88rem; }
    .sleeper-card .sleeper-name { font-weight: 600; }
    .sleeper-card .sleeper-detail { color: #8b949e; font-size: 0.8rem; }
    .rookie-callout-card { display: inline-block; background: rgba(188,140,255,0.08); border: 1px solid #bc8cff; border-radius: 6px; padding: 0.4rem 0.75rem; margin: 3px; font-size: 0.88rem; }
    .rookie-callout-card .rookie-name { font-weight: 600; }
    .rookie-callout-card .rookie-detail { color: #8b949e; font-size: 0.8rem; }
    .handcuff-card { display: flex; align-items: center; gap: 0.5rem; background: rgba(0,212,170,0.05); border: 1px solid rgba(0,212,170,0.3); border-radius: 6px; padding: 0.5rem 0.75rem; margin: 4px 0; font-size: 0.88rem; }
    .handcuff-starter { font-weight: 700; }
    .handcuff-arrow { color: #30363d; }
    .handcuff-backup { font-weight: 600; color: var(--accent); }
    .handcuff-team { color: #8b949e; font-size: 0.8rem; }
    .handcuff-note { color: #8b949e; font-size: 0.8rem; font-style: italic; margin-left: auto; }

    /* Draft action popover */
    .draft-popover {
      position: fixed; z-index: 9999;
      background: #1c2128; border: 1px solid #30363d;
      border-radius: 10px; padding: 0.75rem;
      min-width: 190px; max-width: 240px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.6);
    }
    .popover-player-name {
      font-weight: 700; font-size: 0.9rem; color: #e6edf3;
      padding-bottom: 0.5rem; margin-bottom: 0.4rem;
      border-bottom: 1px solid #30363d;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .popover-status { font-size: 0.8rem; color: #8b949e; padding: 0.25rem 0.5rem; }
    .popover-btn {
      display: block; width: 100%; text-align: left;
      background: transparent; border: none;
      padding: 0.45rem 0.6rem; border-radius: 6px;
      cursor: pointer; font-size: 0.85rem; color: #e6edf3;
      transition: background 0.1s; margin-top: 3px;
    }
    .popover-btn:hover { background: #21262d; }
    .popover-btn.mine-btn { color: var(--accent); font-weight: 700; }
    .popover-btn.their-btn { color: #8b949e; }
    .popover-btn.undo-btn { color: #f0883e; }
    .popover-btn.remove-btn { color: #e94560; }

    /* My Team tab */
    .my-team-summary {
      display: flex; flex-wrap: wrap; gap: 0.5rem;
      margin-bottom: 1.25rem; padding: 0.75rem 1rem;
      background: #161b22; border: 1px solid #30363d; border-radius: 10px;
    }
    .my-team-summary-item { font-size: 0.82rem; color: #8b949e; }
    .my-team-summary-item strong { color: var(--accent); }
    .my-team-empty { text-align: center; padding: 3rem 1rem; color: #484f58; }
    .my-team-empty .empty-icon { font-size: 3rem; margin-bottom: 0.75rem; }
    .my-team-empty p { font-size: 0.9rem; }

    .roster-section { margin-bottom: 1.25rem; }
    .roster-pos-header {
      display: flex; align-items: center; gap: 0.5rem;
      margin-bottom: 0.5rem; padding: 0 0.25rem;
      font-weight: 700; font-size: 0.85rem; color: #8b949e;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .roster-count {
      background: #21262d; border-radius: 10px;
      padding: 0.1rem 0.45rem; font-size: 0.75rem; color: #8b949e;
    }
    .roster-card {
      display: flex; align-items: center; gap: 0.75rem;
      background: #161b22; border: 1px solid rgba(0,212,170,0.25);
      border-radius: 8px; padding: 0.55rem 0.75rem;
      margin-bottom: 0.4rem; transition: background 0.15s;
    }
    .roster-card:hover { background: #1c2128; }
    .roster-star { color: var(--accent); font-size: 0.9rem; flex-shrink: 0; }
    .roster-info { flex: 1; min-width: 0; }
    .roster-name { font-weight: 600; font-size: 0.9rem; }
    .roster-meta { color: #8b949e; font-size: 0.78rem; margin-top: 1px; }
    .roster-bye { display: inline-block; background: rgba(127,140,141,0.2); color: #8b949e; border-radius: 3px; padding: 0 4px; font-size: 0.7rem; font-weight: 700; margin-left: 4px; }
    .roster-remove {
      background: none; border: none; color: #484f58;
      font-size: 0.85rem; cursor: pointer; padding: 0.2rem 0.4rem;
      border-radius: 4px; transition: all 0.15s; flex-shrink: 0;
    }
    .roster-remove:hover { color: #e94560; background: rgba(233,69,96,0.1); }

    /* Top 300 */
    .top300-controls { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; }
    .top300-controls input[type="text"], .top300-controls select {
      background: #161b22; border: 1px solid #30363d; color: #e6edf3;
      border-radius: 8px; padding: 0.5rem 0.75rem; font-size: 0.88rem;
    }
    .top300-controls input[type="text"]:focus, .top300-controls select:focus { outline: none; border-color: var(--accent); }
    .top300-controls input[type="text"] { flex: 1; min-width: 200px; }
    .hide-drafted-label { display: flex; align-items: center; gap: 0.4rem; color: #8b949e; font-size: 0.85rem; cursor: pointer; white-space: nowrap; }
    .hide-drafted-label input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; padding: 0; cursor: pointer; }
    .top300-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.88rem; }
    .top300-table thead th {
      background: #161b22; color: #8b949e; padding: 0.6rem 0.75rem;
      border-bottom: 2px solid #30363d; position: sticky; top: 0;
      text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px;
      cursor: pointer; user-select: none;
    }
    .top300-table thead th:hover { color: var(--accent); }
    .top300-table thead th.sorted-asc::after  { content: " ▲"; font-size: 0.65rem; }
    .top300-table thead th.sorted-desc::after { content: " ▼"; font-size: 0.65rem; }
    .top300-table tbody tr { transition: background 0.15s; cursor: pointer; }
    .top300-table tbody tr:hover { background: rgba(0,212,170,0.04); }
    .top300-table tbody td { padding: 0.5rem 0.75rem; border-bottom: 1px solid #21262d; }
    .top300-table tbody tr.drafted-row td { opacity: 0.25; text-decoration: line-through; }
    .top300-table tbody tr.mine-row { background: rgba(0,212,170,0.06); }
    .top300-table tbody tr.mine-row td { color: var(--accent); font-weight: 600; }
    .top300-table tbody tr.mine-row .team-cell { color: rgba(0,212,170,0.7); font-weight: normal; }
    .top300-table .rank-cell { font-weight: 700; color: #8b949e; width: 50px; }
    .top300-table .name-cell { font-weight: 600; }
    .top300-table .team-cell { color: #8b949e; }
    .top300-table .bye-cell  { color: #8b949e; font-size: 0.82rem; text-align: center; }
    .adp-higher { color: #3fb950; font-size: 0.82rem; }
    .adp-lower  { color: #e94560; font-size: 0.82rem; }
    .adp-same   { color: #484f58; font-size: 0.82rem; }
    .pos-badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.78rem; font-weight: 700; }
    .pos-QB  { background: rgba(233,69,96,0.15);   color: #e94560; }
    .pos-RB  { background: rgba(63,185,80,0.15);   color: #3fb950; }
    .pos-WR  { background: rgba(88,166,255,0.15);  color: #58a6ff; }
    .pos-TE  { background: rgba(240,136,62,0.15);  color: #f0883e; }
    .pos-K   { background: rgba(188,140,255,0.15); color: #bc8cff; }
    .pos-DST { background: rgba(0,212,170,0.15);   color: var(--accent); }

    .rookie-badge-sm { display: inline-block; background: rgba(188,140,255,0.25); color: #bc8cff; border-radius: 3px; padding: 0 4px; font-size: 0.65rem; font-weight: 700; margin-left: 4px; vertical-align: middle; }
    .back-link { color: #8b949e; text-decoration: none; font-size: 0.85rem; }
    .back-link:hover { color: var(--accent); }
    footer { border-top: 1px solid #30363d; padding: 1.5rem 0; text-align: center; color: #484f58; font-size: 0.8rem; }
  </style>
</head>
<body>

  <div class="hero">
    <a href="../index.html" class="back-link">&larr; Back to Glassmation</a>
    <h1>🏈 Fantasy Football Tiers</h1>
    <p class="subtitle">PPR Points League Draft Board — Tiers, Sleepers, Busts &amp; Rookies</p>
    <p class="last-updated" id="lastUpdated"></p>
  </div>

  <div class="draft-bar">
    <span class="draft-bar-label">Session:</span>
    <input id="sessionInput" class="draft-session-input" type="text" value="2026-Draft" placeholder="Session name">
    <button class="draft-bar-btn" onclick="changeSession()">Load</button>
    <span class="draft-count-badge"><span id="draftCount">0</span> Picked</span>
    <span class="my-team-badge">⭐ <span id="myTeamCount">0</span> Mine</span>
    <button class="draft-bar-btn danger" onclick="clearDraft()">Clear All</button>
    <span class="draft-status" id="draftStatus">Loading…</span>
  </div>

  <div class="container-fluid" style="max-width: 1000px;">
    <ul class="nav nav-pills justify-content-center my-3" id="positionTabs" role="tablist"></ul>
    <div class="tab-content" id="positionContent"></div>
  </div>

  <footer>
    <div class="container">
      Fantasy Football Tiers &mdash; PPR Points League Draft Board<br>
      Click any player to mark as picked. Edit <code>data.json</code> / <code>top300.json</code> to update rankings.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    /* ── Supabase ── */
    const SUPABASE_URL      = 'https://fpnmnlrwhwnuefbnehuf.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_NXTAP09deRk87WsP_KdyXg_e1k2Dsih';

    /* ── Draft state ── */
    let currentSession = document.getElementById('sessionInput').value.trim();
    let draftedSet  = new Set(); // all picked (by anyone)
    let myTeamSet   = new Set(); // picked by me
    let playerMeta  = {};        // name_key -> { name, pos, team, bye }

    const TIER_CLASSES   = ['tier-1','tier-2','tier-3','tier-4','tier-5','tier-6'];
    const POS_ORDER      = ['QB','RB','WR','TE','K','DST'];

    function normalizeName(name) {
      return name.replace(/[()^†*]/g, '').trim().toLowerCase();
    }

    /* ── Supabase REST ── */
    function sbHeaders(extra = {}) {
      return { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json', ...extra };
    }
    function setStatus(msg) { document.getElementById('draftStatus').textContent = msg; }

    async function loadDraftState() {
      try {
        const res  = await fetch(
          `${SUPABASE_URL}/rest/v1/ff_draft?session_id=eq.${encodeURIComponent(currentSession)}&select=player_name,is_mine`,
          { headers: sbHeaders() }
        );
        const rows = await res.json();
        draftedSet = new Set((rows || []).map(r => r.player_name));
        myTeamSet  = new Set((rows || []).filter(r => r.is_mine).map(r => r.player_name));
        updateCounts();
        applyDraftState();
        renderMyTeam();
        setStatus('');
      } catch {
        setStatus('⚠ Offline — draft not synced');
      }
    }

    async function sbUpsert(playerName, isMine) {
      await fetch(`${SUPABASE_URL}/rest/v1/ff_draft`, {
        method: 'POST',
        headers: sbHeaders({ Prefer: 'resolution=merge-duplicates,return=minimal' }),
        body: JSON.stringify({ session_id: currentSession, player_name: playerName, is_mine: isMine })
      });
    }

    async function sbDelete(playerName) {
      await fetch(
        `${SUPABASE_URL}/rest/v1/ff_draft?session_id=eq.${encodeURIComponent(currentSession)}&player_name=eq.${encodeURIComponent(playerName)}`,
        { method: 'DELETE', headers: sbHeaders({ Prefer: 'return=minimal' }) }
      );
    }

    function updateCounts() {
      document.getElementById('draftCount').textContent  = draftedSet.size;
      document.getElementById('myTeamCount').textContent = myTeamSet.size;
    }

    function applyDraftState() {
      document.querySelectorAll('.player[data-name]').forEach(el => {
        const n = el.dataset.name;
        const mine    = myTeamSet.has(n);
        const drafted = draftedSet.has(n) && !mine;
        el.classList.toggle('mine',    mine);
        el.classList.toggle('drafted', drafted);
      });
      document.querySelectorAll('#top300Body tr[data-name]').forEach(el => {
        const n = el.dataset.name;
        const mine    = myTeamSet.has(n);
        const drafted = draftedSet.has(n) && !mine;
        el.classList.toggle('mine-row',    mine);
        el.classList.toggle('drafted-row', drafted);
      });
      const hideCb = document.getElementById('hideDraftedCb');
      if (hideCb) applyTop300HideFilter(hideCb.checked);
    }

    /* ── Popover ── */
    function closeDraftPopover() {
      document.getElementById('draftPopover')?.remove();
    }

    function showPickPopover(playerName, event) {
      closeDraftPopover();
      const isDrafted = draftedSet.has(playerName);
      const isMine    = myTeamSet.has(playerName);
      const meta      = playerMeta[playerName] || {};
      const display   = meta.name || playerName;

      const pop = document.createElement('div');
      pop.id = 'draftPopover';
      pop.className = 'draft-popover';

      let inner = `<div class="popover-player-name">${display}</div>`;

      if (!isDrafted) {
        inner += `
          <button class="popover-btn mine-btn"  id="popBtnMine">⭐ My Pick</button>
          <button class="popover-btn their-btn" id="popBtnTheir">📥 Their Pick</button>`;
      } else if (isMine) {
        inner += `
          <div class="popover-status">⭐ On your roster</div>
          <button class="popover-btn their-btn"  id="popBtnSwap">📥 Move to Their Pick</button>
          <button class="popover-btn remove-btn" id="popBtnUndo">↩ Undraft</button>`;
      } else {
        inner += `
          <div class="popover-status">📥 Drafted by opponent</div>
          <button class="popover-btn mine-btn"   id="popBtnClaim">⭐ Move to My Team</button>
          <button class="popover-btn remove-btn" id="popBtnUndo">↩ Undraft</button>`;
      }

      pop.innerHTML = inner;

      /* Position near click target */
      const rect = event.currentTarget.getBoundingClientRect();
      const top  = Math.min(rect.bottom + 6, window.innerHeight - 200);
      const left = Math.min(rect.left,        window.innerWidth  - 250);
      pop.style.top  = top  + 'px';
      pop.style.left = left + 'px';
      document.body.appendChild(pop);

      /* Wire buttons */
      pop.querySelector('#popBtnMine')?.addEventListener('click', async e => {
        e.stopPropagation(); closeDraftPopover();
        draftedSet.add(playerName); myTeamSet.add(playerName);
        updateCounts(); applyDraftState(); renderMyTeam();
        try { await sbUpsert(playerName, true); } catch {}
      });
      pop.querySelector('#popBtnTheir')?.addEventListener('click', async e => {
        e.stopPropagation(); closeDraftPopover();
        draftedSet.add(playerName); myTeamSet.delete(playerName);
        updateCounts(); applyDraftState(); renderMyTeam();
        try { await sbUpsert(playerName, false); } catch {}
      });
      pop.querySelector('#popBtnSwap')?.addEventListener('click', async e => {
        e.stopPropagation(); closeDraftPopover();
        myTeamSet.delete(playerName);
        updateCounts(); applyDraftState(); renderMyTeam();
        try { await sbUpsert(playerName, false); } catch {}
      });
      pop.querySelector('#popBtnClaim')?.addEventListener('click', async e => {
        e.stopPropagation(); closeDraftPopover();
        myTeamSet.add(playerName);
        updateCounts(); applyDraftState(); renderMyTeam();
        try { await sbUpsert(playerName, true); } catch {}
      });
      pop.querySelector('#popBtnUndo')?.addEventListener('click', async e => {
        e.stopPropagation(); closeDraftPopover();
        draftedSet.delete(playerName); myTeamSet.delete(playerName);
        updateCounts(); applyDraftState(); renderMyTeam();
        try { await sbDelete(playerName); } catch {}
      });

      /* Close on outside click */
      setTimeout(() => {
        document.addEventListener('click', closeDraftPopover, { once: true });
      }, 10);
    }

    /* ── My Team ── */
    function renderMyTeam() {
      const container = document.getElementById('myTeamContainer');
      if (!container) return;

      if (myTeamSet.size === 0) {
        container.innerHTML = `
          <div class="my-team-empty">
            <div class="empty-icon">🏈</div>
            <p>Your roster is empty.<br>Click any player during the draft and choose <strong>⭐ My Pick</strong>.</p>
          </div>`;
        return;
      }

      /* Group by position */
      const groups = {};
      POS_ORDER.forEach(p => groups[p] = []);
      groups['FLEX'] = [];

      myTeamSet.forEach(key => {
        const meta = playerMeta[key];
        if (!meta) return;
        const pos = POS_ORDER.includes(meta.pos) ? meta.pos : 'FLEX';
        groups[pos].push({ ...meta, key });
      });

      /* Summary line */
      const summaryParts = POS_ORDER
        .filter(p => groups[p].length)
        .map(p => `<span class="my-team-summary-item"><strong>${groups[p].length}</strong> ${p}</span>`);
      if (groups.FLEX.length) summaryParts.push(`<span class="my-team-summary-item"><strong>${groups.FLEX.length}</strong> Other</span>`);

      let html = `<div class="my-team-summary">${summaryParts.join('<span style="color:#30363d">·</span>')}</div>`;

      const allGroups = [...POS_ORDER, 'FLEX'];
      allGroups.forEach(pos => {
        const players = groups[pos];
        if (!players.length) return;

        html += `<div class="roster-section">
          <div class="roster-pos-header">
            <span class="pos-badge pos-${pos === 'FLEX' ? 'WR' : pos}">${pos}</span>
            <span class="roster-count">${players.length}</span>
          </div>`;

        players.forEach(p => {
          const rookieBadge = p.rookie ? '<span class="rookie-badge-sm">RC</span>' : '';
          const byeBadge    = p.bye   ? `<span class="roster-bye">BYE ${p.bye}</span>` : '';
          html += `<div class="roster-card">
            <span class="roster-star">⭐</span>
            <div class="roster-info">
              <div class="roster-name">${p.name}${rookieBadge}</div>
              <div class="roster-meta">${p.team || ''}${byeBadge}</div>
            </div>
            <button class="roster-remove" data-remove="${p.key}" title="Remove from roster">✕</button>
          </div>`;
        });

        html += '</div>';
      });

      container.innerHTML = html;

      /* Wire remove buttons */
      container.querySelectorAll('[data-remove]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const key = btn.dataset.remove;
          draftedSet.delete(key); myTeamSet.delete(key);
          updateCounts(); applyDraftState(); renderMyTeam();
          try { await sbDelete(key); } catch {}
        });
      });
    }

    /* ── Session management ── */
    async function changeSession() {
      const val = document.getElementById('sessionInput').value.trim();
      if (!val) return;
      currentSession = val;
      setStatus('Loading…');
      await loadDraftState();
    }

    async function clearDraft() {
      if (!draftedSet.size) return;
      if (!confirm(`Clear all ${draftedSet.size} picks for "${currentSession}"?`)) return;
      try {
        await fetch(
          `${SUPABASE_URL}/rest/v1/ff_draft?session_id=eq.${encodeURIComponent(currentSession)}`,
          { method: 'DELETE', headers: sbHeaders({ Prefer: 'return=minimal' }) }
        );
        draftedSet.clear(); myTeamSet.clear();
        updateCounts(); applyDraftState(); renderMyTeam();
        setStatus('Draft cleared.'); setTimeout(() => setStatus(''), 2500);
      } catch { setStatus('⚠ Could not clear — check connection'); }
    }

    /* ── Top 300 ── */
    function buildTop300HTML(players) {
      const posOptions  = [...new Set(players.map(p => p.pos))].sort();
      const teamOptions = [...new Set(players.map(p => p.team))].sort();
      return `
        <div class="top300-controls">
          <input type="text" id="top300Search" placeholder="Search player or team…">
          <select id="top300PosFilter">
            <option value="">All Positions</option>
            ${posOptions.map(p => `<option value="${p}">${p}</option>`).join('')}
          </select>
          <select id="top300TeamFilter">
            <option value="">All Teams</option>
            ${teamOptions.map(t => `<option value="${t}">${t}</option>`).join('')}
          </select>
          <label class="hide-drafted-label">
            <input type="checkbox" id="hideDraftedCb"> Hide Drafted
          </label>
        </div>
        <div style="overflow-x:auto;">
        <table class="top300-table">
          <thead>
            <tr>
              <th data-col="rank" class="sorted-asc">Rank</th>
              <th data-col="name">Player</th>
              <th data-col="team">Team</th>
              <th data-col="pos">Pos</th>
              <th data-col="posRk">Pos Rk</th>
              <th data-col="bye">Bye</th>
              <th data-col="adp">ADP Value</th>
            </tr>
          </thead>
          <tbody id="top300Body"></tbody>
        </table>
        </div>`;
    }

    function renderTop300Rows(players) {
      const tbody = document.getElementById('top300Body');
      tbody.innerHTML = players.map(p => {
        let adpHTML = '<span class="adp-same">—</span>';
        if (p.adp != null) {
          const diff = Math.round(p.adp - p.rank);
          if (diff > 2)       adpHTML = `<span class="adp-higher">+${diff} ▲</span>`;
          else if (diff < -2) adpHTML = `<span class="adp-lower">${diff} ▼</span>`;
        }
        const key         = p.name.toLowerCase();
        const rookieBadge = p.rookie ? '<span class="rookie-badge-sm">RC</span>' : '';
        const byeVal      = p.bye != null ? p.bye : '—';
        const mineStar    = myTeamSet.has(key) ? '⭐ ' : '';
        return `<tr data-name="${key}">
          <td class="rank-cell">${p.rank}</td>
          <td class="name-cell">${mineStar}${p.name}${rookieBadge}</td>
          <td class="team-cell">${p.team}</td>
          <td><span class="pos-badge pos-${p.pos}">${p.pos}</span></td>
          <td>${p.posRk}</td>
          <td class="bye-cell">${byeVal}</td>
          <td>${adpHTML}</td>
        </tr>`;
      }).join('');
      applyDraftState();
    }

    function applyTop300HideFilter(hide) {
      document.querySelectorAll('#top300Body tr[data-name]').forEach(tr => {
        const drafted = draftedSet.has(tr.dataset.name) && !myTeamSet.has(tr.dataset.name);
        tr.style.display = (hide && drafted) ? 'none' : '';
      });
    }

    let _top300All = [];
    function initTop300(allPlayers) {
      _top300All = allPlayers;
      let sortCol = 'rank', sortAsc = true, filtered = [...allPlayers];

      function applyFilters() {
        const search     = document.getElementById('top300Search').value.toLowerCase();
        const posFilter  = document.getElementById('top300PosFilter').value;
        const teamFilter = document.getElementById('top300TeamFilter').value;
        filtered = allPlayers.filter(p => {
          if (posFilter  && p.pos  !== posFilter)  return false;
          if (teamFilter && p.team !== teamFilter) return false;
          if (search && !p.name.toLowerCase().includes(search) && !p.team.toLowerCase().includes(search)) return false;
          return true;
        });
        applySort();
      }
      function applySort() {
        filtered.sort((a, b) => {
          let va = a[sortCol], vb = b[sortCol];
          if (va == null) va = 9999; if (vb == null) vb = 9999;
          if (typeof va === 'string') return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
          return sortAsc ? va - vb : vb - va;
        });
        renderTop300Rows(filtered);
        if (document.getElementById('hideDraftedCb')?.checked) applyTop300HideFilter(true);
      }

      document.getElementById('top300Search').addEventListener('input', applyFilters);
      document.getElementById('top300PosFilter').addEventListener('change', applyFilters);
      document.getElementById('top300TeamFilter').addEventListener('change', applyFilters);
      document.getElementById('hideDraftedCb').addEventListener('change', e => applyTop300HideFilter(e.target.checked));
      document.querySelectorAll('.top300-table thead th').forEach(th => {
        th.addEventListener('click', () => {
          const col = th.dataset.col;
          if (sortCol === col) { sortAsc = !sortAsc; } else { sortCol = col; sortAsc = true; }
          document.querySelectorAll('.top300-table thead th').forEach(t => t.classList.remove('sorted-asc','sorted-desc'));
          th.classList.add(sortAsc ? 'sorted-asc' : 'sorted-desc');
          applySort();
        });
      });
      renderTop300Rows(allPlayers);
    }

    /* ── Main ── */
    async function init() {
      const [resp, top300Resp] = await Promise.all([fetch('data.json'), fetch('top300.json')]);
      const data   = await resp.json();
      const top300 = await top300Resp.json();

      document.getElementById('lastUpdated').textContent =
        'Last updated: ' + data.lastUpdated + ' | Format: ' + data.leagueType;

      /* Build playerMeta lookup from top300 */
      top300.forEach(p => {
        playerMeta[p.name.toLowerCase()] = { name: p.name, pos: p.pos, team: p.team, bye: p.bye, rookie: p.rookie };
      });
      /* Fill in any tier players not in top300 */
      Object.entries(data.positions || {}).forEach(([posKey, pos]) => {
        Object.values(pos.tiers || {}).forEach(players => {
          players.forEach(p => {
            const raw = typeof p === 'object' ? p.name : p;
            const key = normalizeName(raw);
            if (!playerMeta[key]) {
              playerMeta[key] = { name: raw, pos: posKey, team: '', bye: null, rookie: typeof p === 'object' && p.rookie };
            }
          });
        });
      });

      const tabsEl    = document.getElementById('positionTabs');
      const contentEl = document.getElementById('positionContent');

      document.getElementById('sessionInput').addEventListener('keydown', e => { if (e.key === 'Enter') changeSession(); });

      /* ── My Team tab (first) ── */
      tabsEl.insertAdjacentHTML('beforeend', `
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="tab-myteam" data-bs-toggle="pill" data-bs-target="#pane-myteam" type="button" role="tab" aria-selected="true">
            <span class="position-icon">⭐</span>My Team
          </button>
        </li>`);
      const myTeamPane = document.createElement('div');
      myTeamPane.className = 'tab-pane fade show active';
      myTeamPane.id = 'pane-myteam';
      myTeamPane.setAttribute('role', 'tabpanel');
      myTeamPane.innerHTML = '<div id="myTeamContainer"></div>';
      contentEl.appendChild(myTeamPane);

      /* ── Top 300 tab ── */
      tabsEl.insertAdjacentHTML('beforeend', `
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="tab-top300" data-bs-toggle="pill" data-bs-target="#pane-top300" type="button" role="tab" aria-selected="false">
            <span class="position-icon">🏆</span>Top 300
          </button>
        </li>`);
      const top300Pane = document.createElement('div');
      top300Pane.className = 'tab-pane fade';
      top300Pane.id = 'pane-top300';
      top300Pane.setAttribute('role', 'tabpanel');
      top300Pane.innerHTML = buildTop300HTML(top300);
      contentEl.appendChild(top300Pane);

      /* ── Position tabs ── */
      Object.entries(data.positions || {}).forEach(([key, pos]) => {
        tabsEl.insertAdjacentHTML('beforeend', `
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="tab-${key}" data-bs-toggle="pill" data-bs-target="#pane-${key}" type="button" role="tab" aria-selected="false">
              <span class="position-icon">${pos.icon}</span>${pos.title}
            </button>
          </li>`);
        const pane = document.createElement('div');
        pane.className = 'tab-pane fade'; pane.id = `pane-${key}`; pane.setAttribute('role', 'tabpanel');
        let html = pos.note ? `<div class="note-box">${pos.note}</div>` : '';

        Object.entries(pos.tiers || {}).forEach(([tierName, players], tIdx) => {
          const tierClass = TIER_CLASSES[Math.min(tIdx, TIER_CLASSES.length - 1)];
          html += `<div class="tier-card ${tierClass}"><div class="tier-header">${tierName}</div><div class="player-list">`;
          players.forEach(p => {
            const rawName   = typeof p === 'object' ? p.name : p;
            const isSleeper = typeof p === 'object' && p.tag === 'sleeper';
            const isRookie  = typeof p === 'object' && p.rookie;
            const isBust    = typeof p === 'object' && p.bust;
            const hasInjury = typeof p === 'object' && p.injuryRisk;
            const bye       = typeof p === 'object' && p.bye;
            const nameKey   = normalizeName(rawName);
            let cls = 'player';
            if (isSleeper) cls += ' sleeper';
            if (isRookie)  cls += ' rookie';
            if (isBust)    cls += ' bust';
            const rookieBadge = isRookie  ? '<span class="rookie-badge">RC</span>' : '';
            const byeBadge    = bye       ? `<span class="bye-badge">BYE ${bye}</span>` : '';
            const injBadge    = hasInjury ? '<span class="injury-badge">⚠</span>' : '';
            html += `<span class="${cls}" data-name="${nameKey}">${rawName}${rookieBadge}${byeBadge}${injBadge}</span>`;
          });
          html += '</div></div>';
        });
        if (pos.sleepers?.length) html += `<div class="sleeper-box">🔥 <strong>Sleepers:</strong> ${pos.sleepers.join(', ')}</div>`;
        pane.innerHTML = html; contentEl.appendChild(pane);
      });

      /* ── Notes tab ── */
      tabsEl.insertAdjacentHTML('beforeend', `
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="tab-notes" data-bs-toggle="pill" data-bs-target="#pane-notes" type="button" role="tab" aria-selected="false">
            <span class="position-icon">📋</span>Notes
          </button>
        </li>`);
      const notesPane = document.createElement('div');
      notesPane.className = 'tab-pane fade'; notesPane.id = 'pane-notes'; notesPane.setAttribute('role', 'tabpanel');
      let notesHTML = '';
      if (data.rookies?.length) {
        notesHTML += '<div class="callout-section"><h3>🌟 Rookies Worth Drafting</h3>';
        data.rookies.forEach(r => { notesHTML += `<span class="rookie-callout-card"><span class="rookie-name">${r.name}</span> <span class="rookie-detail">${r.pos}, ${r.team}${r.note ? ' — ' + r.note : ''}</span></span>`; });
        notesHTML += '</div>';
      }
      if (data.handcuffs?.length) {
        notesHTML += '<div class="callout-section"><h3>🔗 Handcuffs — Own the Backup</h3>';
        data.handcuffs.forEach(h => { notesHTML += `<div class="handcuff-card"><span class="handcuff-starter">${h.starter}</span><span class="handcuff-arrow">→</span><span class="handcuff-backup">${h.backup}</span><span class="handcuff-team">(${h.team})</span>${h.note ? `<span class="handcuff-note">${h.note}</span>` : ''}</div>`; });
        notesHTML += '</div>';
      }
      if (data.busts?.length) {
        notesHTML += '<div class="callout-section"><h3>🚫 Bust Alert</h3>';
        data.busts.forEach(b => { notesHTML += `<span class="bust-card"><span class="bust-name">${b.name}</span> <span class="bust-detail">${b.pos}, ${b.team}${b.note ? ' — ' + b.note : ''}</span></span>`; });
        notesHTML += '</div>';
      }
      if (data.deepSleepers?.length) {
        notesHTML += '<div class="callout-section"><h3>💤 Deep Sleepers</h3>';
        data.deepSleepers.forEach(s => { notesHTML += `<span class="sleeper-card"><span class="sleeper-name">${s.name}</span> <span class="sleeper-detail">${s.pos}, ${s.team}${s.note ? ' — ' + s.note : ''}</span></span>`; });
        notesHTML += '</div>';
      }
      notesPane.innerHTML = notesHTML || '<p class="text-muted">Add rookies, handcuffs, busts, or deepSleepers arrays to data.json.</p>';
      contentEl.appendChild(notesPane);

      /* ── Event delegation — click any player/row → popover ── */
      contentEl.addEventListener('click', e => {
        const player = e.target.closest('.player[data-name]');
        const row    = e.target.closest('#top300Body tr[data-name]');
        const target = player || row;
        if (target) {
          e.stopPropagation();
          showPickPopover(target.dataset.name, e);
        }
      });

      /* ── Wire Top 300 ── */
      initTop300(top300);

      /* ── Load draft state from Supabase ── */
      await loadDraftState();
    }

    init();
  </script>
</body>
</html>
