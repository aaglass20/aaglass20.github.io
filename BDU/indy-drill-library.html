<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drill Library — The Indy Way — BDU Soccer</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    :root {
      --navy:      #1a1a2e;
      --g:         #00ff88;
      --g-dark:    #00b368;
      --g-light:   #f0fff8;
      --blue:      #0779e4;
      --gray-100:  #f7fafc;
      --gray-200:  #edf2f7;
      --gray-300:  #e2e8f0;
      --gray-400:  #a0aec0;
      --gray-500:  #718096;
      --gray-600:  #4a5568;
      --white:     #ffffff;
      --shadow-sm: 0 1px 4px rgba(0,0,0,.07);
      --shadow-md: 0 4px 16px rgba(0,0,0,.10);
      --shadow-lg: 0 8px 32px rgba(0,0,0,.15);
      --radius:    12px;
      --radius-sm: 8px;
    }

    /* ── Hero strip ── */
    .lib-hero {
      background: linear-gradient(135deg, #003366 0%, #0779e4 100%);
      color: white;
      text-align: center;
      padding: 2rem 1.5rem 1.75rem;
      position: relative;
      overflow: hidden;
    }
    .lib-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 75% 50%, rgba(0,255,136,.15) 0%, transparent 60%);
      pointer-events: none;
    }
    .lib-hero-badge {
      display: inline-block;
      background: rgba(0,255,136,.15);
      border: 1px solid rgba(0,255,136,.35);
      color: var(--g);
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: .3rem .9rem;
      border-radius: 99px;
      margin-bottom: .75rem;
      position: relative;
      z-index: 1;
    }
    .lib-hero h2 {
      font-family: 'Rajdhani', sans-serif;
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      font-weight: 700;
      margin: 0 0 .4rem;
      position: relative;
      z-index: 1;
    }
    .lib-hero h2 span { color: var(--g); }
    .lib-hero p {
      font-size: .92rem;
      opacity: .8;
      margin: 0;
      position: relative;
      z-index: 1;
    }

    /* ── Controls bar ── */
    .lib-controls {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.75rem 1.5rem .75rem;
    }
    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin-bottom: 1rem;
    }
    .filter-pill {
      padding: .4rem 1rem;
      border-radius: 99px;
      border: 2px solid var(--gray-300);
      background: var(--white);
      font-size: .83rem;
      font-weight: 700;
      color: var(--gray-600);
      cursor: pointer;
      font-family: inherit;
      transition: all .15s;
    }
    .filter-pill:hover { border-color: var(--g-dark); color: var(--g-dark); }
    .filter-pill.active { background: var(--g); border-color: var(--g); color: var(--navy); }

    .drill-count {
      font-size: .82rem;
      color: var(--gray-400);
      font-weight: 600;
    }

    /* ── Search ── */
    .search-wrap {
      position: relative;
      margin-bottom: 1rem;
    }
    .drill-search {
      width: 100%;
      padding: .55rem 2.5rem .55rem 1rem;
      border: 2px solid var(--gray-300);
      border-radius: 99px;
      font-size: .9rem;
      font-family: inherit;
      color: var(--gray-600);
      outline: none;
      transition: border-color .15s;
      box-sizing: border-box;
    }
    .drill-search:focus { border-color: var(--g-dark); }
    .drill-search::placeholder { color: var(--gray-400); }
    .search-clear {
      position: absolute;
      right: .75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--gray-400);
      cursor: pointer;
      font-size: .85rem;
      display: none;
      padding: .2rem;
      line-height: 1;
    }
    .search-clear.visible { display: block; }

    /* ── Card grid ── */
    .drill-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
    }
    @media (max-width: 900px) { .drill-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 580px) { .drill-grid { grid-template-columns: 1fr; } }

    /* ── Individual card ── */
    .drill-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      border-left: 4px solid var(--g);
      padding: 1.1rem 1.1rem 1rem;
      display: flex;
      flex-direction: column;
      gap: .55rem;
      transition: box-shadow .18s, transform .18s;
    }
    .drill-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .drill-card.hidden { display: none; }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
    }
    .cat-badge {
      font-size: .67rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      padding: .15rem .55rem;
      border-radius: 99px;
      color: white;
      white-space: nowrap;
    }
    .cat-Warmup    { background: #f59e0b; }
    .cat-Technical { background: #0779e4; }
    .cat-Passing   { background: #00b368; }
    .cat-Dribbling { background: #7c3aed; }
    .cat-Possession{ background: #38b2ac; }
    .cat-Shooting  { background: #dc2626; }
    .cat-Tactical  { background: #d97706; }
    .cat-Games     { background: #f97316; }
    .cat-Scrimmage { background: #0891b2; }
    .cat-Fitness   { background: #16a34a; }

    .skill-badge {
      font-size: .67rem; font-weight: 700; padding: .15rem .55rem;
      border-radius: 99px; text-transform: uppercase; letter-spacing: .06em;
      white-space: nowrap;
    }
    .skill-beginner     { background: #d4f5e9; color: #1a7f5a; }
    .skill-intermediate { background: #fef9c3; color: #927200; }
    .skill-advanced     { background: #fee2e2; color: #c0392b; }
    .vc-skill { border-radius: 99px; padding: .2rem .65rem; font-size: .75rem; font-weight: 700; }
    .vc-skill-beginner     { background: #d4f5e9; color: #1a7f5a; }
    .vc-skill-intermediate { background: #fef9c3; color: #927200; }
    .vc-skill-advanced     { background: #fee2e2; color: #c0392b; }

    .age-chip {
      font-size: .67rem;
      font-weight: 700;
      color: var(--gray-500);
      background: var(--gray-100);
      padding: .15rem .55rem;
      border-radius: 99px;
      white-space: nowrap;
    }

    .card-name {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--navy);
      line-height: 1.25;
      display: flex;
      align-items: center;
      gap: .4rem;
    }
    .card-icon { font-size: 1.2rem; flex-shrink: 0; }

    .card-desc {
      font-size: .82rem;
      color: var(--gray-500);
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .equip-row {
      display: flex;
      flex-wrap: wrap;
      gap: .3rem;
    }
    .equip-tag {
      font-size: .68rem;
      color: var(--gray-500);
      background: var(--gray-100);
      padding: .1rem .5rem;
      border-radius: 99px;
    }

    .card-actions {
      display: flex;
      gap: .5rem;
      margin-top: auto;
      padding-top: .25rem;
    }
    .btn-watch {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .35rem;
      background: var(--g);
      color: var(--navy);
      font-weight: 700;
      font-size: .82rem;
      padding: .5rem .75rem;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      font-family: inherit;
      transition: background .15s;
    }
    .btn-watch:hover { background: #00e67a; }
    .btn-watch.no-video { background: var(--gray-200); color: var(--gray-400); cursor: default; }

    .btn-plan {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .35rem;
      border: 2px solid var(--navy);
      color: var(--navy);
      font-weight: 700;
      font-size: .82rem;
      padding: .5rem .75rem;
      border-radius: var(--radius-sm);
      background: none;
      text-decoration: none;
      transition: all .15s;
      white-space: nowrap;
    }
    .btn-plan:hover { background: var(--navy); color: var(--g); }

    /* ── Video Modal ── */
    .vid-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.72);
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .vid-overlay.open { display: flex; }

    .vid-box {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 700px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .vid-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--gray-200);
      position: sticky;
      top: 0;
      background: var(--white);
      z-index: 1;
    }
    .vid-header-name {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--navy);
    }
    .vid-close {
      background: none;
      border: none;
      font-size: 1.15rem;
      color: var(--gray-400);
      cursor: pointer;
      padding: .2rem .5rem;
      border-radius: 6px;
      line-height: 1;
    }
    .vid-close:hover { background: var(--gray-100); }

    .vid-player-wrap {
      background: #000;
    }
    .vid-player-wrap video { display: block; width: 100%; max-height: 400px; }

    .vid-body {
      padding: 1.25rem;
    }
    .vid-chips {
      display: flex;
      gap: .4rem;
      flex-wrap: wrap;
      margin-bottom: .9rem;
    }
    .vid-chip {
      font-size: .72rem;
      font-weight: 700;
      padding: .2rem .65rem;
      border-radius: 99px;
    }
    .vc-cat { color: white; }
    .vc-age { background: var(--gray-100); color: var(--gray-600); }
    .vc-dur { background: var(--g-light); color: var(--g-dark); }

    .vid-desc {
      font-size: .88rem;
      color: var(--gray-500);
      line-height: 1.6;
      margin-bottom: 1rem;
    }
    .vid-coaching-title {
      font-size: .7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--gray-400);
      margin-bottom: .5rem;
    }
    .vid-coaching ul {
      margin: 0;
      padding-left: 1.2rem;
    }
    .vid-coaching li {
      font-size: .84rem;
      color: var(--gray-600);
      line-height: 1.55;
      margin-bottom: .25rem;
    }
  </style>
</head>
<body>

<header>
  <div class="highlight-banner">
    <img src="images/INDEPENDENCE%20BDU_SHIELD_WHITE_small.png" alt="BDU Logo">
    <h1>Drill Library</h1>
  </div>
</header>

<div class="waffle-menu-toggle" onclick="toggleWaffleMenu()">
  <span></span><span></span><span></span>
</div>
<div id="waffleMenuContainer"></div>
<script>
  fetch('menus/waffle-menu.html')
    .then(r => r.text())
    .then(html => { document.getElementById('waffleMenuContainer').innerHTML = html; });
</script>

<div class="lib-hero">
  <div class="lib-hero-badge">The Indy Way</div>
  <h2>Drill Library — <span>35 Drills</span></h2>
  <p>Filter by category &nbsp;·&nbsp; click ▶ to preview any drill with video</p>
</div>

<div class="lib-controls">
  <div class="search-wrap">
    <input type="text" id="drillSearch" class="drill-search" placeholder="Search drills…" autocomplete="off">
    <button class="search-clear" id="searchClear" aria-label="Clear search">✕</button>
  </div>
  <div class="filter-pills" id="filterPills"></div>
  <div class="drill-count" id="drillCount"></div>
</div>

<div class="drill-grid" id="drillGrid"></div>

<!-- Video Modal -->
<div class="vid-overlay" id="vidOverlay">
  <div class="vid-box">
    <div class="vid-header">
      <div class="vid-header-name" id="vidName"></div>
      <button class="vid-close" id="vidClose">✕</button>
    </div>
    <div class="vid-player-wrap">
      <video id="vidPlayer" controls></video>
    </div>
    <div class="vid-body">
      <div class="vid-chips" id="vidChips"></div>
      <div class="vid-desc" id="vidDesc"></div>
      <div class="vid-coaching">
        <div class="vid-coaching-title">Coaching Cues</div>
        <ul id="vidCoaching"></ul>
      </div>
    </div>
  </div>
</div>

<div id="shared-footer"></div>
<script>
  fetch('menus/shared-footer.html')
    .then(r => r.text())
    .then(html => { document.getElementById('shared-footer').innerHTML = html; });
</script>
<script src="scripts/scripts.js"></script>

<script>
const DRILLS = [
  // Warmup
  { id: '4-person-movement-warmup', name: '4 Person Movement Warmup', icon: '🏃', category: 'Warmup', minAge: 'U8', duration: 10, videoFile: '4 person Movement Warmup.mp4', equipment: ['Balls'], desc: 'Four players move continuously for 1–2 minutes. Avoid circular patterns. Progress through: two-touch, one-touch, one-bounce juggle, then no-bounce juggle. Can evolve to headers or combination sequences such as chest to thigh to foot.', coaching: ['Keep moving — no standing still', 'Progress the difficulty each round', 'Head up to see teammates early'] },
  { id: 'circle-passing-warmup', name: 'Circle Passing Warmup', icon: '⭕', category: 'Warmup', minAge: 'U8', duration: 10, videoFile: 'circlePassingWarmup.mp4', equipment: ['Cones', 'Balls (multiple)'], desc: 'The coach starts with 5 balls, feeding each one to a player around the circle. Each player controls the ball and passes in one direction; the next player controls and passes on, then sprints to the next cone. Add additional balls as rhythm develops.', coaching: ['Sprint to next cone after your pass', 'One or two touches max — keep the rhythm', 'Communicate before and after the ball'] },
  { id: 'agility-ladder', name: 'Agility Ladder', icon: '🏃', category: 'Fitness', skillLevel: 'Intermediate', minAge: 'U8', duration: 10, videoFile: null, equipment: ['Agility ladder'], desc: 'Players work through a progression of agility ladder patterns — from single-leg runs and 2-in to lateral shuffles, Ickey Shuffle, Carioca, plyometric hops, and a ladder-to-sprint exit — building foot speed, coordination, and movement fluency before the main session.', coaching: ["Quiet Feet: slapping or heavy stomping means flat feet — cue players to stay light on the balls of their feet", "Pump the Pockets: arms drive the feet; elbows at 90 degrees, hands moving cheek-to-pocket — lazy hands = slow feet", "Eyes Up: once the foot pattern is learned, players should look slightly forward rather than straight down at the rungs"], setup: ['Equipment: One agility ladder laid flat on the ground (10–12 rungs).', 'Players: Single-file line behind the start; 1 player runs at a time, jog back around the outside to rejoin the queue.', 'Spacing: Allow one player to finish before the next starts to avoid collisions.'], howToPlay: ['Phase 1 — Linear Basics: Run two patterns — single-leg run (one foot per box) and 2-in (both feet per box). 2 reps each.', 'Phase 2 — Lateral Patterns: Run two patterns — lateral in-and-outs (sideways, lead-in, trail-in, lead-out, trail-out) and Ickey Shuffle (in-in-out zigzag). 2 reps each.', 'Phase 3 — Rotational: Carioca/Grapevine sideways down the ladder (trail foot crosses front, then behind). 2 reps each direction.', 'Phase 4 — Plyometrics: Hopscotch (straddle-single-straddle) and lateral bunny hops (two feet in-out-in-out slalom). 2 reps each.', 'Phase 5 — Soccer Exit: Complete any pattern (e.g., 2-in or Ickey Shuffle) and explode into a 5–10 yd acceleration sprint off the final rung. Optional: partner serves a 1-touch ball at the exit. 2–3 reps.'], coachingPoints: ['Quiet Feet: Players who slap the rungs are landing flat-footed and absorbing ground contact instead of bouncing off it — cue "light as a feather" and demonstrate the difference between heavy and quick contacts.', 'Arms Drive the Legs: Foot turnover is limited by arm swing. Pump elbows at 90 degrees cheek-to-pocket — test it by having players run arms-crossed and feel the loss of speed.', 'Progress Then Speed: Teach the pattern correctly at 50% speed first, then build to full speed — rushing a pattern before it is clean produces sloppy footwork that reinforces bad habits.'], modifications: ['U8/Beginners: Run phases 1–2 only (single-leg run, 2-in, lateral in-and-outs). Walk through the pattern once before each run.', 'U10 standard: Phases 1–4 as described. Skip the soccer exit ball work.', 'U14+/Advanced: All 5 phases including sprint exit with partner ball serve. Add In-In-Out with 180° hip flip for recovery mechanics.', 'Large groups (12+): Set up 2–3 ladders running simultaneously; players rotate between ladders on the coach\'s signal.'] },
  { id: 'parallel-corridor-footwork', name: 'Parallel Corridor Footwork', icon: '↔️', category: 'Fitness', skillLevel: 'Intermediate', minAge: 'U8', duration: 12, videoFile: 'tactics/Lateral Movement.webm', equipment: ['Cones', 'Balls (one per pair)'], desc: 'Two parallel cone corridors — pairs work through 5 progressive phases: mirror lateral shuffles, slalom weave, sole rollovers, creative dribbling, and a partner passing shuttle — building from pure movement into ball work and partner coordination.', coaching: ['All: stay low with knees bent and weight on the balls of your feet — no heel-striking during lateral shifts', 'All: the rollover is a positive prep touch, not a stop — set the ball clean for the next pass', 'Partners: call each other\'s names and find your passing rhythm as you advance down the corridor'], setup: ['Corridor: Set two parallel rows of 6–7 cones, spaced 5–10 yds apart across, with cones ~2 yds apart along each row.', 'Players: Split evenly into two lines — Line A at Row 1, Line B at Row 2, partners facing each other across the channel.', 'Equipment: 1 ball per pair (phases 3–5); no ball needed for phases 1–2.'], howToPlay: ['Phase 1 — Mirror Lateral Shuffle: Both partners face each other and shuffle laterally cone-to-cone in sync, staying low with no crossover steps. 4 reps each.', 'Phase 2 — Forward Slalom Weave: Players slalom in and out of their own row of cones, emphasizing quick plant-and-push deceleration off the outside foot. 4 reps each.', 'Phase 3 — Linear Sole Rollovers: Each player has a ball and travels down the corridor using continuous sole rollovers (alternating feet), keeping hips square and ball within reach. 4 reps each.', 'Phase 4 — Creative Slalom Dribbling: Players dribble their own slalom using any technique (inside-outside cuts, sole rolls, La Croqueta), head up between touches, varying tempo through each cone. 4 reps each.', 'Phase 5 — Passing & Rollover Shuttle: With one ball per pair, Player A passes across to Player B at Cone 1. Player B executes a lateral rollover toward Cone 2 and plays back. The pair advances pass-by-pass down all 6–7 cones, then returns switching feet/direction.'], coachingPoints: ['Low Center of Gravity: All lateral movement phases require knees bent and weight on the balls of the feet — standing tall or heel-striking kills quickness and makes the shuffles sloppy.', 'Active Prep Touch: In phases 3 and 5, the rollover must be a purposeful, directional touch that sets the ball cleanly for the next action — players who stop the ball dead lose rhythm and slow the sequence.', 'Rhythm & Communication: Phase 5 only works if partners establish a passing rhythm and call each other — encourage them to find a cadence ("ready, yes, ready, yes") and maintain it down the full corridor.'], modifications: ['U8/Beginners: Run phases 1–3 only; skip phases 4–5 until movement patterns are comfortable. Keep the channel short (4 cones).', 'U10 standard: All 5 phases as described.', 'U14+/Advanced: In phase 5, require one-touch return passes — partner must play back immediately off the rollover without an extra settle touch.', 'Large groups (12+): Set up two corridors running simultaneously; rotate pairs between corridors between phases.'] },
  { id: 'shadow-dribbling', name: 'Shadow Dribbling', icon: '👥', category: 'Warmup', skillLevel: 'Beginner', minAge: 'U8', duration: 10, videoFile: null, equipment: ['Cones', 'Balls (one per pair)'], desc: 'In pairs, the leader dribbles freely within a grid while the follower mirrors their movements as closely as possible without touching; roles swap on the coach\'s whistle.', coaching: ['Leader: use sudden changes of direction and pace — make it hard to follow', 'Follower: watch the leader\'s hips, not their feet — it gives you the earliest read', 'All: heads up throughout — know where your pair is in the grid'], setup: ['Grid: 20×20 yd square marked with cones. Shrink to 15×15 for smaller groups or younger ages.', 'Players: Pairs spread across the grid — up to 10 pairs share a standard grid.', 'Equipment: One ball per pair — leader starts with the ball, follower has none.'], howToPlay: ['The leader dribbles freely around the grid, making sudden changes of direction, speed, and angle.', 'The follower stays directly behind the leader, mirroring every movement as closely as possible without making contact.', 'If the follower loses the leader by more than 3 yards, the leader slows to a jog until the gap closes.', 'On the coach\'s whistle, the leader stops, passes the ball to the follower, and roles reverse immediately.', 'Run 3–5 rounds of 60–90 seconds each.'], coachingPoints: ['Body Orientation: The follower should be reading the leader\'s hips and shoulders — not the ball — to anticipate direction changes before they happen.', 'Close Control: Leaders should use all surfaces of the foot (inside, outside, sole) to keep the ball tight at high speed, making it harder to predict the next move.', 'Spatial Awareness: Both players must be aware of other pairs in the grid at all times — heads up is mandatory for safe play.'], modifications: ['U8/Beginners: Leaders walk or jog only — no sprinting. Keep the grid large (20×20) and focus on gentle direction changes.', 'U10–U12: Standard format. Add a challenge: the pair that stays closest for a full 60-second round wins.', 'U14+/Advanced: Shrink the grid to 15×15 and allow full-speed running. Leaders may stop dead or execute a skill move (pull-back, scissor) at any time.', 'Large groups (12+): Give both partners a ball — leader and follower dribble simultaneously while maintaining their relative positions.'] },

  // Technical
  { id: '1v1-basic', name: '1v1 Attacking Duel', icon: '⚔️', category: 'Technical', minAge: 'U8', duration: 15, videoFile: null, equipment: ['Cones', 'Balls', 'Small goals or target gates'], desc: 'Set up two small goals 15–20 yards apart. Players alternate as attacker and defender. Attacker starts with the ball and tries to score; defender applies pressure. Switch roles after each duel.', coaching: ["Attacker: head up, read the defender's body shape", 'Defender: stay on your feet, force to the weak side', 'Change of pace is key — slow then fast'] },
  { id: 'pass-tap-pass-back', name: 'Pass, Tap, Pass Back', icon: '👟', category: 'Technical', minAge: 'U8', duration: 10, videoFile: 'Pass, tap, pass back, 3 distances.mp4', equipment: ['Cones', 'Balls'], desc: 'Two players pass back and forth. One player has a cone in front of them and must receive on one side, drag the ball across the cone, and play it back. Work for about a minute, then switch. Repeat the sequence, removing the front cone each round until only one cone remains.', coaching: ["Sharp first touch across the cone — don't let the ball run", 'Use both feet on the drag', 'Communicate — call "ready" when set to receive'] },
  { id: 'cone-passing', name: 'Cone Passing', icon: '🎯', category: 'Technical', minAge: 'U10', duration: 15, videoFile: 'cone passing.mp4', equipment: ['Many cones', 'Balls'], desc: 'Cones spread across half the field. Three groups (red/blue/yellow) rotate through. Player A performs a skill then passes to Player B following the color rotation; Player A moves to an open cone. Sets last 2–3 min with 1 min rest; run 5 sets. Change skill and pass type each set.', coaching: ["Sharp skill before the pass — don't rush the touch", 'Move immediately after passing', 'Awareness of color rotation'] },
  { id: 'movement-skill-reset', name: '10 Person Continuous', icon: '🔄', category: 'Technical', minAge: 'U10', duration: 15, videoFile: 'MovementSkillResetFindTarget.mp4', equipment: ['Cones', 'Balls'], desc: "Players run through the gate and call a teammate's name to receive a pass. They play the ball back while calling their own name, then run through the gate again. Run each round for 1–2 minutes. Works across multiple skill sets: two-touch, volleys, headers, chest trap, thigh trap, foot trap, and turns.", coaching: ['Eye contact before the pass — use their name', 'First touch must be out of your feet', 'Receive, play, reset — stay alert'] },
  { id: 'three-group-continuous', name: 'Three-Group Continuous', icon: '🔄', category: 'Technical', skillLevel: 'Intermediate', minAge: 'U10', duration: 15, videoFile: '10 Person Continuous - 3 way.webm', equipment: ['Cones', 'Pinnies', 'Balls (one per station pair)'], desc: 'Three groups rotate through a hub-and-rim circuit: central runners check out of a center hub toward outer cone stations, receive a served ball, execute the designated skill to play it across to their station partner, then reset to the hub and find the next open station.', coaching: ['Central runner: check at game speed with arms up and call loudly before the ball is played', 'All: arrive at the station with an open body profile so you can see the server, the partner, and the hub simultaneously', 'All: heads up through the center hub — scan for the next open station before you arrive, not after'], setup: ['Hub: Mark a center circle using cones or pinnies (~10 yd diameter).', 'Rim: Place 4–6 cones evenly spaced around the outside of the hub, each ~5–8 yds from the center.', 'Players: Three equal groups. Group 1 starts in the center hub without balls. Groups 2 & 3 pair up at the outer cone stations — one player 3 feet left of the cone, one 3 feet right.', 'Balls: One ball per station pair — the left-side player starts with the ball.'], howToPlay: ['Check & Call: A central player checks out of the hub toward a free station, makes eye contact, and calls for the ball.', 'Give-and-Go: The station player serves the ball to the central player, who executes the designated skill and plays it directly to the station partner.', 'Reset: The central player checks back through the hub, scans, and explodes to the next available station.', 'Rotation: Each 60-second round, the group in the hub is the working group. After the round, groups rotate — every group works the center once per skill set.', 'Progressions: Run each skill for one full rotation (3 × 60 sec) before advancing — ground (two-touch → one-touch), aerial (chest → thigh → header), striking (volley → half-volley → juggle-and-return), then Turn & Switch.'], coachingPoints: ["Vocal & Physical Check: Central players must check at game speed with arms up and call the server's name before the pass is made — silent or slow checks do not replicate game conditions.", 'Open Body Shape: Arrive at the station with hips angled to see the server, the partner, and the center field simultaneously — arriving square limits vision and slows distribution.', 'Scanning in the Hub: Players must lift their heads before they arrive in the center, not after — early scanning allows them to accelerate directly toward the next free station rather than stopping to look.'], modifications: ['U10/Introductory: Start with ground only (two-touch) and 4 outer cones; skip aerial progressions until the rotation pattern is learned.', 'U12 standard: Full ground + aerial progressions; introduce Turn & Switch at the end of the session.', 'U14+/Advanced: Add a competitive element — central players count clean reps in 60 sec; group with the most reps across all rotations wins.', 'Large groups (15+): Add a 4th or 5th outer station; keep the same rotation structure.'] },

  // Passing
  { id: 'gates-competition-passing', name: 'Gates Competition Passing', icon: '🚪', category: 'Passing', minAge: 'U10', duration: 12, videoFile: 'Gates competition passing.mp4', equipment: ['Many cones', 'Balls'], desc: 'Two evenly matched players pair up and pass to each other through as many gates as possible in 1 minute, tallying a combined score. Pairs compete against the rest of the group. Rest for 1 minute, then challenge another pair. Lower-scoring pair completes a brief exercise.', coaching: ['Communicate — pick the gate together before moving', 'Sharp, firm passes — let the ball do the work', 'Head up to spot the next available gate'] },
  { id: 'long-passes-4', name: 'Long Passes (4 People)', icon: '↔️', category: 'Passing', minAge: 'U12', duration: 15, videoFile: 'long passes 4 people.mp4', equipment: ['Cones', 'Balls'], desc: 'Groups of four — two players on each side facing each other. Receive and trap, then play to the teammate beside you, who drives the ball across. Next, follow with a lofting pass or chip. Finally, add give-and-go combinations. Emphasize communication.', coaching: ["Open body to receive — don't receive across yourself", 'Lofted passes: follow through high, lean back', 'Communication: call before the pass arrives'] },
  { id: 'get-open', name: 'Get Open', icon: '🏃', category: 'Passing', minAge: 'U10', duration: 12, videoFile: 'get open.mp4', equipment: ['Cones', 'Balls'], desc: 'One player starts in the middle as a defender. Two players run back and forth, attempting to get open and complete a pass through the middle. A cone can be placed in between to create a designated passing lane.', coaching: ["Change direction with purpose — don't just run sideways", 'Use a shoulder drop or change of pace to create separation', "Passer: wait for the right moment — don't force the pass"] },

  // Dribbling
  { id: 'gates-competition-dribbling', name: 'Gates Competition Dribbling', icon: '🚪', category: 'Dribbling', minAge: 'U10', duration: 12, videoFile: 'Gates competition dribbling.mp4', equipment: ['Many cones', 'Balls'], desc: 'Two evenly matched players pair up. One player dribbles through as many gates as possible in 1 minute while the other counts. Rest for 1 minute, then switch. The player with the lower total completes a brief exercise. Also works as a team competition.', coaching: ['Head up — scan for the next gate before finishing the current one', "Keep the ball tight — don't overrun gates", "Accelerate through the gate, don't slow before it"] },
  { id: 'target-dribbling', name: 'Target Dribbling', icon: '🎯', category: 'Dribbling', skillLevel: 'Intermediate', minAge: 'U10', duration: 12, videoFile: 'Target Dribbling.webm', equipment: ['Pinnies (yellow + red)', 'Balls (one per player)', 'Cones'], desc: 'Players dribble freely inside a grid, scoring points by rolling the ball over flat pinnies — a high-value yellow penny in the center (3 pts) representing direct penetration, and lower-value red pennies on the perimeter (1 pt) representing wide outlets — while defenders try to intercept or force them wide.', coaching: ["Ball carrier: attack the center yellow if a seam opens — don't default to the easy wide target every time", "Ball carrier: if defenders collapse on the middle, lift your head and bail wide immediately — don't force it into traffic", 'All: keep the ball glued to your feet — sole rolls and tight inside/outside touches to roll cleanly over a flat marker'], setup: ['Grid: 20×20 yd square marked with cones (adjust size based on player count).', 'Center target: Place 1 yellow pinnie flat in the center of the grid (3 points).', 'Perimeter targets: Place 4–6 red pinnies flat around the edges and corners of the grid (1 point each).', 'Players: Teams of 3–4 v 3–4 (or individual free-for-all for younger groups). Each player has their own ball.'], howToPlay: ['Objective: Dribble your ball directly over a target pinnie to score — the ball must roll cleanly over the flat pinnie, not past it.', 'Scoring: Yellow center penny = 3 points. Red perimeter penny = 1 point.', 'No-Repeat Rule: A player cannot score on the same penny back-to-back — after hitting the center yellow, they must score on a red perimeter penny before attacking the middle again.', 'Conquer & Flip (optional): When a player scores, their team flips the penny over (claims it). First team to claim the center plus a set number of wide targets wins the round.', 'Game Length: Play 60–90 second rounds with 30 sec rest; run 3–5 rounds, then swap defenders.'], coachingPoints: ['Directness & Forward Mentality: The 3-point center target rewards players who are bold enough to drive straight at the central corridor when a lane opens — hesitation hands the advantage to the defense.', 'Scanning & Decision-Making: When defenders pack the middle, the correct read is to escape wide — players who keep their heads up and recognize the overload early will consistently score more points than those who force.', 'Close Ball Control: Rolling the ball precisely over a flat pinnie demands tight, controlled touches; players quickly learn that overrunning the ball or using big touches causes them to miss the target and lose possession.'], modifications: ['U10/Beginners: Remove defenders — run as a solo time-trial where each player scores as many points as possible in 60 seconds. Focus on tight dribbling and scanning.', 'U12 standard: Full game with defenders as described — no-repeat rule active.', 'U14+/Advanced: Add a rule that the center yellow can only be scored off a directional change (must enter from a wide angle after touching a red penny — simulating a cut inside).', 'Large groups (12+): Split into two grids running simultaneously; winners from each grid compete in a final round.'] },

  // Possession
  { id: 'bumper-keepaway', name: 'Bumper Keepaway', icon: '🔵', category: 'Possession', minAge: 'U10', duration: 15, videoFile: 'bumper Keepaway.mp4', equipment: ['Cones', 'Balls', 'Pinnies'], desc: 'Two teams play keep-away with 4 gates. Score a point by passing through a gate or dribbling through one. A neutral bumper player works the sideline for either team in possession. Keep score.', coaching: ["Move after your pass — don't stand still", "Use the bumper — they're always available", "Defenders: press as a unit, don't ball-watch"] },
  { id: 'across-the-river', name: 'Across The River', icon: '🌊', category: 'Possession', minAge: 'U12', duration: 15, videoFile: 'across the river.mp4', equipment: ['Cones', 'Balls', 'Pinnies'], desc: "Two grids, two teams. E.g. 5 vs. 2 — the larger team plays keep-away while the pair tries to win the ball and pass it to the opposite grid. If the larger team wins it back, they continue. If the smaller team is struggling, they can call for reinforcements.", coaching: ["Play away from pressure — see the switch before it's needed", 'Quick first touch to beat the press', "Defenders: cut passing lanes, don't chase blindly"] },
  { id: '3-team-keepaway', name: '3 Team Keep Away', icon: '🔄', category: 'Possession', minAge: 'U10', duration: 15, videoFile: '3 Team Keep Away.mp4', equipment: ['Cones', 'Balls', 'Pinnies (3 colors)'], desc: 'Set up four cone goals. Three teams wear different colors — e.g. with 13 players: 5 blue, 5 yellow, 3 red. Red plays for whichever team has possession. Teams score by completing a pass to a teammate through a gate. First to 5 wins.', coaching: ['Neutral team: read the game — which side needs you?', 'Scoring team: find the gates, create overloads', 'Communicate constantly — talk your team into position'] },
  { id: 'pierce-the-circle', name: 'Pierce The Circle', icon: '🎯', category: 'Possession', minAge: 'U12', duration: 15, videoFile: 'tactics/Pierce the Circle.webm', equipment: ['Cones or center circle', 'Balls', 'Pinnies (2 colors)'], desc: 'A possession-and-vision game where both teams operate outside a central circle and score by completing a ground pass directly through it to a teammate on the opposite side.', coaching: ['Draw defenders to one flank before playing through the center', 'Weak-side players: always adjust your angle to create a passing lane', "Pass weight must be firm — don't let it stall inside the dead zone"], setup: ['Grid: Use the regulation center circle, or mark a circle with cones (10–18 yds diameter). Smaller circles increase technical difficulty.', 'Players: Two equal teams — 4v4 up to 7v7.', 'Equipment: 1 ball (plus spares nearby), cones/pinnies to mark boundaries and designate teams.'], howToPlay: ['Perimeter Possession: Both teams operate entirely outside the circle in a continuous keep-away game.', 'Scoring: A team scores 1 point by completing a ground pass directly through the circle to a teammate on the opposite side.', 'Restricted Zone: The central circle is a no-entry dead zone. Stepping inside = immediate turnover. Ball stops inside = possession to opposing team.', 'Game Length: Play to 5 points, or run timed intervals of 3–5 minutes per round.'], coachingPoints: ['Draw to Exploit: Bait defenders toward one flank with short passes before firing a line-breaking ball through the vacated central channel.', 'Off-Ball Movement: Players on the weak side must constantly adjust their angles to provide open passing lanes through the circle.', 'Pass Weight & Accuracy: Passes through the middle need firm pace to ensure they do not stall inside the dead zone.'] },

  // Shooting
  { id: 'block-or-one-time', name: 'Block Or One Time', icon: '🥅', category: 'Shooting', minAge: 'U12', duration: 15, videoFile: 'block or one time.mp4', equipment: ['Goal', 'Balls', 'Pinnies'], desc: 'Divide into three teams. One team at the goal post; the other two at the 18-yard box. The coach plays a ball in and the striking team attempts to score. The post team blocks. If strikers score, defenders touch the pole again. If defense wins the ball, they become the strikers.', coaching: ["Strikers: shoot early — don't wait for the perfect moment", 'Defenders: get in the shooting lane, be brave', 'Call "mine!" when taking the block'] },
  { id: 'closing-fast-shot-fast', name: 'Closing Fast, Shot Fast', icon: '🏹', category: 'Shooting', minAge: 'U12', duration: 15, videoFile: 'closingFastShotFast.mp4', equipment: ['2 Goals', 'Balls', 'Goalkeepers'], desc: 'Two goals approximately 20–25 yards apart. Each goal has a goalkeeper. Defenders must close quickly to prevent shots. The offensive team should shoot quickly and frequently. Players use communication and movement to create and deny opportunities.', coaching: ["Attackers: shoot the moment you're in range — no extra touch", 'Defenders: close angle together, not solo', 'GK: set your feet before each shot — stay alert'] },
  { id: '4-point-shooting', name: '4 Point Shooting', icon: '⚽', category: 'Shooting', minAge: 'U14', duration: 20, videoFile: '4 point shooting.mp4', equipment: ['Goal', 'Balls', 'Goalkeeper', 'Cones'], desc: 'Four lines rotate left to right. After each line shoots, they remain in play for rebounds. Line 1: receive pass, turn, shoot. Line 2: one-touch from coach. Line 3: move then shoot. Line 4: cross for finish. Keep good tempo throughout.', coaching: ['Anticipate the rebound — get in position before the shot', "Attack the ball on the cross, don't wait for it", 'Keep tempo high — reset quickly after each rep'] },
  { id: 'receive-turn-finish', name: 'Receive, Turn & Finish', icon: '🥅', category: 'Shooting', skillLevel: 'Intermediate', minAge: 'U12', duration: 15, videoFile: 'Charge Touch Shoot.mp4', equipment: ['2 Goals (or pug goals)', 'Cones', 'Balls'], desc: 'Two lines sprint toward timing cones where the coach serves a ground pass; each player takes one directional touch to open toward their respective goal and finishes with a quick strike. Players rotate to the opposite line to train both feet.', coaching: ['Touch: take a 45-degree directional touch into open space — not a dead stop', 'Timing: decelerate slightly before the second cone to stay balanced on the receive', 'Plant foot: point it directly at the target corner to prevent hooking or pushing the shot wide'], setup: ['Goals: Two goals set side-by-side or angled outward on the end line (full-size, intermediate, or pug goals — with or without keepers).', 'Players: Two lines at a starting cone near midfield or top of the center circle.', 'Timing cones: A second cone ~10–15 yards ahead of each line, roughly 20–25 yards from the respective goal.', 'Server: Coach positioned near the goals with a supply of balls, serving ground passes to each line in alternation.'], howToPlay: ['The Run: A player from one line sprints forward toward their timing cone.', 'The Delivery: The coach serves a firm ground pass timed to arrive as the player breaks past the timing cone.', 'The Touch & Turn: Left-line players open hips toward the left goal with a back-foot touch for a left-footed finish; right-line players do the same toward the right goal.', 'The Finish: Strike on target within 1–2 touches of receiving.', 'Rotation: Players rotate to the back of the opposite line so every player gets reps finishing with both feet.'], coachingPoints: ['Weight of the Touch: A positive, forward-angled first touch sets up the shot — a dead stop kills momentum and allows the keeper to set.', 'Timing the Run: Players who arrive at the timing cone too fast are off-balance on the receive; a slight deceleration before the cone keeps hips and shoulders through the ball.', 'Hips & Plant Foot: The plant foot must point at the target corner — a misaligned plant sends the shot across the body and wide.'], modifications: ['U12/Introductory: Reduce pace of the serve; allow players to take an extra touch before shooting.', 'U14 standard: Full-speed serve + directional touch as described; hold players to 2 touches maximum.', 'U16+/Advanced: Add a passive goalkeeper to each goal; require a placed finish (pick a corner before the touch).', 'Large groups (12+): Run both lines simultaneously — left and right players go at the same time to keep rep rate high.'] },

  // Tactical
  { id: '3v2-transition', name: '3v2 Transition', icon: '⚡', category: 'Tactical', minAge: 'U12', duration: 20, videoFile: '3v2 Transition.mp4', equipment: ['Cones', 'Balls', 'Pinnies'], desc: 'Three grids: the first runs a 3v2, the second is a transition zone, the third hosts a 2v2. One team holds pinnies. When a defender wins the ball, they drop their pinnie and drive into the transition zone to pass to teammates. A dropped pinnie is picked up by a waiting player to form the next 2v2.', coaching: ['When you win it, go immediately — no pause', 'Third man: check shoulder and be available in next grid', 'Defenders: deny the transition pass first, then recover'] },
  { id: 'rock-the-river', name: 'Rock the River', icon: '🌊', category: 'Tactical', skillLevel: 'Advanced', minAge: 'U12', duration: 20, videoFile: 'tactics/Rock the River.webm', equipment: ['Cones', 'Balls (many)'], desc: 'Two teams each occupy a possession grid separated by a river of scattered balls ("rocks"); the team without the ball sends 2 defenders across to press, the possession team plays keep-away, and when defenders win it they must chip it over the river to teammates — forcing aerial technique on every transition.', coaching: ["Possessing team: spread and recycle quickly — make the 2 defenders chase, don't let them get set", "Pressing pair: trap toward one corner together, don't split; call for the 3rd only when the ball is pinned", 'Receiving team: set your feet and open your body before the aerial ball arrives — first touch controls the tempo'], setup: ['Grids: Two equal boxes (15×15 to 20×20 yds), placed side by side with a 5–10 yd river channel running between them.', 'River: Scatter 8–12 spare balls across the river channel floor as "rocks."', 'Players: Two equal teams of 5–6 players — each team starts in their home grid.', 'Equipment: Cones to mark both grids and the river boundaries, large supply of balls for rocks and the live match ball.'], howToPlay: ["Possession: Coach serves the match ball into Team A's grid. Team A plays keep-away; Team B sends 2 defenders across the river to press.", 'Reinforcement: If the pressing pair cannot win the ball within a set time (e.g. 8 passes by Team A), they may call for a 3rd defender to cross the river.', 'Transition: When defenders win the ball, they must chip or lift it across the river to their teammates — ground passes deflect off the rocks.', 'Role flip: Once Team B receives in their grid, they play keep-away and Team A sends 2 defenders across.', 'Out-of-bounds scramble: If the ball exits, the river goes live — any player may sprint in to claim a rock. The team that grabs one becomes the possession team; coach adjudicates ties.'], coachingPoints: ['Aerial Technique: The river forces chips and driven air balls — focus on a clean instep contact, leaning back slightly, with a relaxed follow-through to control trajectory and distance.', 'Pressing Pair Organization: Two defenders must work as a unit — trap toward a corner, cut the pass back, and resist both chasing the ball blindly; call for the 3rd only when the ball is truly pinned.', 'First Touch Out of the Air: Receivers must read the flight early, position their body before contact, and cushion the ball into open space on the first touch to absorb immediate pressure.'], modifications: ['U12/Introductory: Narrow the river to 3–4 yds and use fewer rocks; allow a low-driven pass that rolls to the side of the rocks rather than requiring a true chip.', 'U14 standard: Full game as described — 5–10 yd river, 8–12 rocks, reinforcement rule active.', 'U16+/Advanced: Restrict the transition chip to one touch — receivers must redirect on first contact rather than controlling and then passing.', 'Large groups (14+): Split into two simultaneous games with separate rivers; rotate teams every 5 minutes.'] },
  { id: 'lateral-shadow', name: 'Lateral Shadow', icon: '⚡', category: 'Tactical', skillLevel: 'Advanced', minAge: 'U12', duration: 15, videoFile: 'Lateral Shadow.webm', equipment: ['Full goal', 'Goalkeeper', 'Cones', 'Balls', 'Pinnies'], desc: 'The defender plays a ground pass to the attacker ~30 yards out, then sprints to close — decelerating into a side-on jockey stance 2 yards away; the defender shadows laterally to steer the attacker wide and waits for a heavy touch or hesitation before executing a block or poke tackle, with a goalkeeper behind to save any forced shots.', coaching: ['Defender: sprint to eat the grass while the ball travels — then slam the brakes and get side-on 2 yards away', "Defender: open your body to offer the outside lane; your job is to deny the center, not win the ball immediately", "Attacker: use body feints and changes of pace to create a moment of hesitation — that's your window to attack the space"], setup: ['Field: 18-yard box area with a standard goal and goalkeeper.', 'Defender line: Positioned centrally or slightly staggered, 3–5 yards beyond the top of the 18, each player holding a ball.', 'Attacker line: Stationed at a cone ~10–12 yards further upfield (roughly 30–35 yards from goal), facing the defender.', 'Equipment: Balls with the defender line, pinnies to distinguish lines, cone to mark the attacker start position.'], howToPlay: ['Service: The defender plays a firm ground pass to the feet of the attacker and immediately sprints to close.', 'Breakdown: Around 2–3 yards from the attacker, the defender drops their hips, chops strides, and assumes a side-on jockey stance.', 'Shadow & Steer: The defender shadows the attacker laterally — matching their rhythm and body feints — while opening their body to offer the outside/weak-foot lane and blocking the central route to goal.', 'Pounce: The defender waits for a heavy touch, hesitation, or head-down dribble before attempting a block or poke tackle. If the attacker shoots from a poor angle under pressure, the defender has done their job.', 'Rotation: Attacker retrieves their ball and joins the defender line; defender rotates to the attacker line.'], coachingPoints: ['Fast Approach, Slow Arrival: Sprint while the ball is traveling to close distance quickly, but decelerate sharply 2 yards from the attacker — a flat-out arrival means the attacker can knock it past and run.', 'Surfer Stance: Hips angled ~45 degrees, knees bent, weight on the balls of the feet — this allows instant lateral push-off in either direction. Never stand chest-square or flat-footed.', "Patience Over Heroics: The defender's job is not to win the ball in the first two seconds — it is to deny a quality shot. A hurried, wide-angle attempt with the keeper set is a defensive win."], modifications: ['U12/Introductory: Remove the goalkeeper initially; defenders focus only on approach and jockey stance without worrying about the live shot. Add GK once technique is sound.', 'U14 standard: Full drill as described — live 1v1 with goalkeeper.', 'U16+/Advanced: Start the attacker facing away from goal (back-to-goal receive) so the defender must react to the turn — adding a recovery run element.', 'Large groups (12+): Run two parallel lines simultaneously; coach calls "go" to both pairs at once to increase rep rate.'] },
  { id: 'king-of-the-end-zones', name: 'King of the End Zones', icon: '👑', category: 'Tactical', skillLevel: 'Advanced', minAge: 'U12', duration: 20, videoFile: 'King of the End Zones.mp4', equipment: ['Cones', 'Balls', 'Pinnies (4 colors)'], desc: 'Four equal teams compete with a central grid and end zones at each end — two teams battle in the middle while one waits in each end zone; the team that plays a penetrating pass into their target end zone immediately swaps with the waiting team there, creating a relentless cycle of transition.', coaching: ['In possession: head up early — find the vertical pass before the defense gets set', 'Swapping team: sprint into the grid and attack immediately — no walking in', 'Defending team: press together on the turnover, don\'t wait for the attack to organize'], setup: ['Grid: Central playing area ~25×20 yds with an end zone (5–8 yds deep) at each end.', 'Players: 4 equal teams of 3–4 players in distinct colored pinnies (Red, Blue, Yellow, Green).', 'Starting positions: Two teams in the central grid (e.g. Red vs. Blue); one team in each end zone (Yellow north, Green south).', 'Equipment: Cones to mark grid and end zones, one ball in play, extra balls nearby for quick restarts.'], howToPlay: ['Objective: The two teams in the middle each attack the opposite end zone — Red attacks south, Blue attacks north.', 'Scoring / Swap: A team scores by completing a controlled pass into their target end zone. The scoring team enters that end zone; the waiting team sprints into the grid and attacks in the opposite direction.', 'Turnover Rule: If possession is lost, the defending team takes over immediately. Coach can feed a fresh ball to the team that wins possession.', 'Out of Bounds: Opposing team restarts with a kick-in, or coach feeds a fresh ball to maintain tempo.', 'Game Length: Play continuously for 10–15 minutes, or first team to 5 swaps wins.'], coachingPoints: ['Vertical Penetration: The end zones reward teams that look forward first — players must scan and play the vertical pass as soon as it opens rather than recycling sideways.', 'Instant Transition: The moment a swap happens, the incoming team must shift from passive waiting to full-speed attack in the opposite direction — that disorganization window is where possession is lost.', 'Defensive Pressure: Press immediately after a swap — the new attacking team is temporarily disorganized, and that is the window to win the ball back.'], modifications: ['U12/Introductory: Reduce to 3v3 in the middle with a 2-touch rule to slow the game and help players recognize passing lanes.', 'U14 standard: 4v4 in the middle, no touch restrictions, full-speed swaps as described.', 'U16+/Advanced: Allow the end-zone team one "target player" who can receive in the zone and play back out — adding a wall-pass / lay-off scoring option.', 'Large groups (20+): Run two grids simultaneously; top team from each grid meets in a challenge round.'] },
  { id: 'around-the-horn', name: 'Around the Horn', icon: '↔️', category: 'Tactical', skillLevel: 'Advanced', minAge: 'U12', duration: 20, videoFile: 'The Spine.mp4', equipment: ['Full-size goals (2)', 'Goalkeepers (2)', 'Cones', 'Balls', 'Pinnies (2 colors)'], desc: 'Two teams defend side-by-side goals on the end line, separated by a cone spine the ball cannot cross — possession must loop around the far tip of the cones to switch flanks and attack, while players can cross the spine freely for blind-side runs and crosses.', coaching: ['Ball carrier: commit defenders to one flank before driving the long switch around the cone tip', 'Runners: time your cross-spine run for when the ball swings wide — arrive late, not early', 'Defenders: shift as a unit when the ball crosses the halfway point — no one stays ball-side'], setup: ['Goals: Two full-size or intermediate goals side-by-side on the end line, each with a goalkeeper.', 'Spine: A line of cones runs from between the goals straight down the center of the pitch to midfield or three-quarter field.', 'Players: Two equal teams (7v7 to 11v11) — each team defends one goal.', 'Equipment: Cones for the spine, multiple balls near each goal, pinnies in two colors.'], howToPlay: ['The Ball Rule: The ball may NOT cross or pass through the cone spine — teams must circulate around the far tip of the cones to switch flanks.', 'The Player Rule: Attacking and defending players CAN cross the spine freely at any time — use this for blind-side overlaps, crosses, and defensive recovery.', 'Scoring: A team scores by finishing past the opposing goalkeeper in their assigned goal.', 'Turnovers: If the ball crosses the spine, possession transfers immediately to the opposing team at the point of infringement.', 'Game Length: Play in 8–10 minute periods, or first to 5 goals.'], coachingPoints: ['Width Before Penetration: The spine forces the ball wide, teaching players to build in the channels and create crossing opportunities before attempting to score.', 'Blind-Side Timing: Because the ball must travel the long route, central runners have time to check defenders, cross the spine, and arrive in the box from an unexpected angle — cross late, arrive fast.', 'Defensive Shape: Defenders must actively shift from one side of the spine to the other as the attack changes flanks — static defenders will be pulled apart by the wide circulation.'], modifications: ['U12/Introductory: Shorten the cone spine to just past the 18-yard box to reduce circulation distance. Add a 3-touch rule to slow tempo.', 'U14–U16 standard: Full spine to midfield as described. No touch restrictions.', 'Advanced/U16+: Add a second ball — coach feeds a fresh ball to either goalkeeper while a goal is being contested, creating continuous two-goal attack pressure.', 'Small groups (6v6 or fewer): Use smaller intermediate goals and shorten the spine to two-thirds field.'] },

  // Games
  { id: 'small-sided-4v4', name: '4v4 Small-Sided Game', icon: '🏟️', category: 'Scrimmage', minAge: 'U8', duration: 20, videoFile: null, equipment: ['Cones', 'Balls', 'Pinnies', 'Small goals'], desc: 'Four players per team on a 30×20 yd grid with small goals. Free play — minimal coaching intervention. Rotate subs every 2–3 minutes. Great closer for applying what was trained in the session.', coaching: ['Apply the session theme — see it happen in a real game', 'Communicate — call names, call for the ball', 'Transition immediately when possession changes'] },
  { id: 'overload-scrimmage', name: 'Overload Scrimmage', icon: '🔢', category: 'Scrimmage', minAge: 'U10', duration: 20, videoFile: null, equipment: ['Cones', 'Balls', 'Pinnies', 'Small goals'], desc: 'Set up a 6v4 (or 5v3) on a medium grid with small goals. The larger team maintains possession and finishes; the short-handed team presses to win the ball and score on transition. Swap the advantage every 3–4 min so both groups experience both roles.', coaching: ['Bigger team: switch the point of attack to exploit the overload', 'Smaller team: press as a unit — create turnovers with numbers', 'Transition: go the moment possession changes'] },
  { id: 'attack-vs-defense', name: 'Attack vs. Defense', icon: '⚔️', category: 'Games', minAge: 'U10', duration: 20, videoFile: null, equipment: ['Cones', 'Balls', 'Pinnies', 'Full goal', 'Goalkeeper'], desc: 'Attackers set up in your team shape (e.g. 4-3-3 front third). Defenders hold a back line. Coach plays balls in; attack must combine and finish within 8 seconds of entry. Defenders win the ball and play to target cones on the sideline. Rotate lines every 4 minutes.', coaching: ["Attackers: combination play first — don't shoot early into the block", 'Defenders: hold the line, communicate, step together on the trigger', 'GK: organize the shape constantly — be the eyes behind'] },
  { id: 'scrimmage-7v7', name: '7v7 Scrimmage', icon: '🟢', category: 'Scrimmage', minAge: 'U10', duration: 25, videoFile: null, equipment: ['Medium goals', 'Balls', 'Pinnies', 'Goalkeepers (2)'], desc: '7v7 on a medium field (~55×40 yds). One GK, two defenders, two mids, two forwards per side. Positional shape begins to emerge at this format — great for introducing team structure without the full-field complexity. Standard restart rules. Rotate GK each period.', coaching: ['Hold your position — resist the urge to all chase the ball', 'GK: claim your box and communicate the back line', 'Midfielders: connect defense to attack — be available both ways'] },
  { id: 'scrimmage-9v9', name: '9v9 Scrimmage', icon: '🔵', category: 'Scrimmage', minAge: 'U12', duration: 30, videoFile: null, equipment: ['Large goals', 'Balls', 'Pinnies', 'Goalkeepers (2)'], desc: '9v9 on a reduced field (~70×50 yds). Standard rules with two goalkeepers. Natural format for U12–U14 groups to rehearse positional shape and team tactics without the demands of a full 11v11. Coach may freeze once or twice to address the session theme, then restart immediately.', coaching: ['Maintain your team shape — attack and defend as a unit', 'Switch the point of attack when the flank is crowded', 'Pressure, cover, balance — defensive shape starts with the front line'] },
  { id: 'scrimmage-11v11', name: '11v11 Full Field Scrimmage', icon: '🏟️', category: 'Scrimmage', minAge: 'U14', duration: 35, videoFile: null, equipment: ['Full goals', 'Balls', 'Pinnies', 'Goalkeepers (2)'], desc: 'Full 11v11 on a regulation field with two goalkeepers. Minimal coaching stops — let the game run and teach itself. Coach may pause once per half to highlight the session theme, then restart with a free kick. Rotate GK each half. Ideal as the final block of a session.', coaching: ["Let the game breathe — don't over-coach from the sideline", 'GK: organize set pieces, command the box, be the loudest voice on the field', 'Captains: manage the game — call shape, call switches, lead'] },
  { id: 'soccer-baseball', name: 'Soccer Baseball', icon: '🏟️', category: 'Games', skillLevel: 'Intermediate', minAge: 'U10', duration: 25, videoFile: 'tactics/baseball.webm', equipment: ['Goal', 'Goalkeeper', 'Balls (many)', 'Cones'], desc: 'Two teams compete simultaneously — one sprints a relay around the 18-yard box like baseball bases while the other fires rapid penalty kicks; every goal scored before the last runner finishes counts as a run. Teams switch roles after each half-inning; the team with the most runs after 3 innings wins.', coaching: ["Shooters: place the ball — a composed finish under fatigue beats a panic blast over the bar", "Runners: sprint the full perimeter at max effort — your team's score depends on how fast you run the bases", 'All: keep tempo high — shooters shag their own balls and reload immediately; no standing around'], setup: ['Diamond: The 18-yard box serves as the baseball diamond — goalpost 1 is Home, near corner of the 18 on the goal line is 1st base, far top corner is 2nd base, opposite top corner is 3rd base, opposite goalpost/end line is Home again.', 'Teams: Two equal groups — one is the Running Team, one is the Shooting Team.', 'Shooting line: Penalty spot, or a cone line at 12–15 yards from goal.', 'Equipment: Goal with goalkeeper, large supply of balls at the shooting cone, cones to mark base corners if not already defined by the box.'], howToPlay: ['Relay: Runner 1 sprints the full perimeter of the 18 (Home → 1st → 2nd → 3rd → Home). Once Runner 1 rounds 2nd base (top-far corner), Runner 2 starts. Subsequent runners release as the teammate ahead rounds the same final corner (3rd base).', 'Shooting: While runners are going, the shooting team fires rapid PK shots from the spot or the cone line. Shooters shag their own balls and rejoin the queue immediately.', 'Scoring: Every goal the shooting team scores before the final runner crosses Home = 1 Run.', 'Inning: Once all runners have finished, teams swap roles (running ↔ shooting). Both halves of a swap = 1 inning.', 'Winner: Play 3 full innings, tally total runs each team scored while shooting, and crown the winner.'], coachingPoints: ['Conditioning Disguised as Competition: Runners sprint at 100% because the other team is scoring — this converts a fitness drill into a competitive game without a single "run a lap" command.', "Composure Under Pressure: Shooters feel urgency from the runners' pace, which mirrors in-game pressure — the coaching win is players who stop blasting and start placing shots.", 'Tempo Management: The drill lives or dies by pace — keep spare balls at the shooting line and loudly push shooters to reload and fire; any lull deflates the competitive tension.'], modifications: ['U10/Introductory: Reduce to 1 full inning; allow a shorter running loop (penalty box only, not the full 18). Shooters shoot from a closer cone (8–10 yards).', 'U12 standard: Full 3-inning game as described — penalty spot, relay around the 18.', "U14+/Advanced: Add a 2-touch rule for shooters (first touch set + shoot — no standing over the ball), or require the shooting team to receive a served ball before finishing rather than static PKs.", 'Large groups (16+): Run two shooting queues simultaneously to maximize rep rate and maintain pressure on runners.'] },
];

const CATEGORIES = ['All', 'Warmup', 'Fitness', 'Technical', 'Passing', 'Dribbling', 'Possession', 'Shooting', 'Tactical', 'Games', 'Scrimmage'];
let activeFilter = 'All';
let searchQuery = '';

function init() {
  buildFilterPills();
  buildCards();
  updateCount();
  wireModal();
  wireSearch();
}

function buildFilterPills() {
  const container = document.getElementById('filterPills');
  CATEGORIES.forEach(cat => {
    const count = cat === 'All' ? DRILLS.length : DRILLS.filter(d => d.category === cat).length;
    const btn = document.createElement('button');
    btn.className = 'filter-pill' + (cat === 'All' ? ' active' : '');
    btn.textContent = `${cat} (${count})`;
    btn.dataset.cat = cat;
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = cat;
      filterCards();
    });
    container.appendChild(btn);
  });
}

function buildCards() {
  const grid = document.getElementById('drillGrid');
  DRILLS.forEach(drill => {
    const card = document.createElement('div');
    card.className = 'drill-card';
    card.dataset.category = drill.category;
    card.dataset.id = drill.id;

    const equipHTML = drill.equipment.map(e => `<span class="equip-tag">${e}</span>`).join('');
    const hasVideo = !!drill.videoFile;

    card.innerHTML = `
      <div class="card-top">
        <span class="cat-badge cat-${drill.category}">${drill.category}</span>
        <span class="age-chip">${drill.minAge}+</span>
        ${drill.skillLevel ? `<span class="skill-badge skill-${drill.skillLevel.toLowerCase()}">${drill.skillLevel}</span>` : ''}
      </div>
      <div class="card-name">
        <span class="card-icon">${drill.icon}</span>
        ${drill.name}
      </div>
      <div class="card-desc">${drill.desc}</div>
      <div class="equip-row">${equipHTML}</div>
      <div class="card-actions">
        <button class="btn-watch${hasVideo ? '' : ' no-video'}" data-id="${drill.id}">
          ${hasVideo ? '▶ Watch Video' : '— No Video'}
        </button>
        <a class="btn-plan" href="indy-practice-builder.html">→ Build Plan</a>
      </div>
    `;

    if (hasVideo) {
      card.querySelector('.btn-watch').addEventListener('click', () => openModal(drill));
    }

    grid.appendChild(card);
  });
}

function filterCards() {
  const q = searchQuery.trim().toLowerCase();
  document.querySelectorAll('.drill-card').forEach(card => {
    const drill = DRILLS.find(d => d.id === card.dataset.id);
    const matchCat = activeFilter === 'All' || drill.category === activeFilter;
    const matchSearch = !q ||
      drill.name.toLowerCase().includes(q) ||
      drill.desc.toLowerCase().includes(q) ||
      drill.equipment.some(e => e.toLowerCase().includes(q)) ||
      drill.category.toLowerCase().includes(q);
    card.classList.toggle('hidden', !(matchCat && matchSearch));
  });
  updateCount();
}

function updateCount() {
  const visible = document.querySelectorAll('.drill-card:not(.hidden)').length;
  document.getElementById('drillCount').textContent = `Showing ${visible} drill${visible !== 1 ? 's' : ''}`;
}

function wireSearch() {
  const input = document.getElementById('drillSearch');
  const clearBtn = document.getElementById('searchClear');
  input.addEventListener('input', () => {
    searchQuery = input.value;
    clearBtn.classList.toggle('visible', searchQuery.length > 0);
    filterCards();
  });
  clearBtn.addEventListener('click', () => {
    input.value = '';
    searchQuery = '';
    clearBtn.classList.remove('visible');
    filterCards();
    input.focus();
  });
}

// ── Modal ──
function wireModal() {
  document.getElementById('vidClose').addEventListener('click', closeModal);
  document.getElementById('vidOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('vidOverlay')) closeModal();
  });
}

function openModal(drill) {
  const player = document.getElementById('vidPlayer');
  const src = drill.videoFile
    ? (drill.videoFile.includes('/') ? drill.videoFile : `vid/${drill.videoFile}`)
    : '';
  player.src = src;
  document.getElementById('vidName').textContent = `${drill.icon} ${drill.name}`;

  // Chips
  const chips = document.getElementById('vidChips');
  chips.innerHTML = `
    <span class="vid-chip vc-cat cat-${drill.category}">${drill.category}</span>
    <span class="vid-chip vc-age">${drill.minAge}+</span>
    <span class="vid-chip vc-dur">${drill.duration} min</span>
    ${drill.skillLevel ? `<span class="vid-chip vc-skill vc-skill-${drill.skillLevel.toLowerCase()}">${drill.skillLevel}</span>` : ''}
  `;

  // Structured sections (Setup / How to Play / Coaching Points) or fallback
  const body = document.getElementById('vidDesc').parentElement;
  document.getElementById('vidDesc').textContent = drill.desc;

  const ul = document.getElementById('vidCoaching');
  ul.innerHTML = drill.coaching.map(c => `<li>${c}</li>`).join('');

  // Append structured sections if present
  let structured = body.querySelector('.drill-structured');
  if (structured) structured.remove();
  if (drill.setup || drill.howToPlay || drill.coachingPoints) {
    const sections = [];
    if (drill.setup) sections.push({ icon: '⚙️', label: 'Setup & Equipment', items: drill.setup });
    if (drill.howToPlay) sections.push({ icon: '🎮', label: 'How to Play', items: drill.howToPlay });
    if (drill.coachingPoints) sections.push({ icon: '🎯', label: 'Key Coaching Points', items: drill.coachingPoints });
    if (drill.modifications) sections.push({ icon: '🔧', label: 'Age Modifications', items: drill.modifications });
    const div = document.createElement('div');
    div.className = 'drill-structured';
    div.innerHTML = sections.map(s => `
      <div style="margin-top:1.1rem;padding-top:1rem;border-top:1px solid #edf2f7;">
        <div style="font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:#a0aec0;margin-bottom:.5rem;">${s.icon} ${s.label}</div>
        <ul style="margin:0;padding-left:1.2rem;">${s.items.map(i => `<li style="font-size:.86rem;color:#4a5568;line-height:1.6;margin-bottom:.3rem;">${i}</li>`).join('')}</ul>
      </div>
    `).join('');
    body.appendChild(div);
  }

  document.getElementById('vidOverlay').classList.add('open');
}

function closeModal() {
  const player = document.getElementById('vidPlayer');
  player.pause();
  player.src = '';
  document.getElementById('vidOverlay').classList.remove('open');
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
