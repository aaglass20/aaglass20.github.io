<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drill Library — The Indy Way — BDU Soccer</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    :root {
      --navy:      #1a1a2e;
      --g:         #00ff88;
      --g-dark:    #00b368;
      --g-light:   #f0fff8;
      --blue:      #0779e4;
      --gray-100:  #f7fafc;
      --gray-200:  #edf2f7;
      --gray-300:  #e2e8f0;
      --gray-400:  #a0aec0;
      --gray-500:  #718096;
      --gray-600:  #4a5568;
      --white:     #ffffff;
      --shadow-sm: 0 1px 4px rgba(0,0,0,.07);
      --shadow-md: 0 4px 16px rgba(0,0,0,.10);
      --shadow-lg: 0 8px 32px rgba(0,0,0,.15);
      --radius:    12px;
      --radius-sm: 8px;
    }

    /* ── Hero strip ── */
    .lib-hero {
      background: linear-gradient(135deg, #003366 0%, #0779e4 100%);
      color: white;
      text-align: center;
      padding: 2rem 1.5rem 1.75rem;
      position: relative;
      overflow: hidden;
    }
    .lib-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 75% 50%, rgba(0,255,136,.15) 0%, transparent 60%);
      pointer-events: none;
    }
    .lib-hero-badge {
      display: inline-block;
      background: rgba(0,255,136,.15);
      border: 1px solid rgba(0,255,136,.35);
      color: var(--g);
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: .3rem .9rem;
      border-radius: 99px;
      margin-bottom: .75rem;
      position: relative;
      z-index: 1;
    }
    .lib-hero h2 {
      font-family: 'Rajdhani', sans-serif;
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      font-weight: 700;
      margin: 0 0 .4rem;
      position: relative;
      z-index: 1;
    }
    .lib-hero h2 span { color: var(--g); }
    .lib-hero p {
      font-size: .92rem;
      opacity: .8;
      margin: 0;
      position: relative;
      z-index: 1;
    }

    /* ── Controls bar ── */
    .lib-controls {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.75rem 1.5rem .75rem;
    }
    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin-bottom: 1rem;
    }
    .filter-pill {
      padding: .4rem 1rem;
      border-radius: 99px;
      border: 2px solid var(--gray-300);
      background: var(--white);
      font-size: .83rem;
      font-weight: 700;
      color: var(--gray-600);
      cursor: pointer;
      font-family: inherit;
      transition: all .15s;
    }
    .filter-pill:hover { border-color: var(--g-dark); color: var(--g-dark); }
    .filter-pill.active { background: var(--g); border-color: var(--g); color: var(--navy); }

    .age-pills { align-items: center; }
    .age-pills .pill-label { font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--gray-400); margin-right: .15rem; }
    .age-pills .filter-pill.active { background: var(--navy); border-color: var(--navy); color: var(--g); }

    .drill-count {
      font-size: .82rem;
      color: var(--gray-400);
      font-weight: 600;
    }

    /* ── Search ── */
    .search-wrap {
      position: relative;
      margin-bottom: 1rem;
    }
    .drill-search {
      width: 100%;
      padding: .55rem 2.5rem .55rem 1rem;
      border: 2px solid var(--gray-300);
      border-radius: 99px;
      font-size: .9rem;
      font-family: inherit;
      color: var(--gray-600);
      outline: none;
      transition: border-color .15s;
      box-sizing: border-box;
    }
    .drill-search:focus { border-color: var(--g-dark); }
    .drill-search::placeholder { color: var(--gray-400); }
    .search-clear {
      position: absolute;
      right: .75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--gray-400);
      cursor: pointer;
      font-size: .85rem;
      display: none;
      padding: .2rem;
      line-height: 1;
    }
    .search-clear.visible { display: block; }

    /* ── Card grid ── */
    .drill-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
    }
    @media (max-width: 900px) { .drill-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 580px) { .drill-grid { grid-template-columns: 1fr; } }

    /* ── Individual card ── */
    .drill-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      border-left: 4px solid var(--g);
      padding: 1.1rem 1.1rem 1rem;
      display: flex;
      flex-direction: column;
      gap: .55rem;
      transition: box-shadow .18s, transform .18s;
    }
    .drill-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .drill-card.hidden { display: none; }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
    }
    .cat-badge {
      font-size: .67rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      padding: .15rem .55rem;
      border-radius: 99px;
      color: white;
      white-space: nowrap;
    }
    .cat-Warmup    { background: #f59e0b; }
    .cat-Technical { background: #0779e4; }
    .cat-Passing   { background: #00b368; }
    .cat-Dribbling { background: #7c3aed; }
    .cat-Possession{ background: #38b2ac; }
    .cat-Shooting  { background: #dc2626; }
    .cat-Tactical  { background: #d97706; }
    .cat-Games     { background: #f97316; }
    .cat-Scrimmage { background: #0891b2; }
    .cat-Fitness   { background: #16a34a; }
    .cat-Goalkeeping { background: #be185d; }
    .focus-row { display: flex; flex-wrap: wrap; gap: .3rem; margin: -.3rem 0 .9rem; }
    .focus-tag { font-size: .7rem; font-weight: 700; color: #003366; background: #e6eef7; padding: .15rem .55rem; border-radius: 99px; }
    .focus-select { padding: .38rem .7rem; border-radius: 99px; border: 2px solid var(--gray-300); background: var(--white); font: inherit; font-size: .83rem; font-weight: 700; color: var(--gray-600); max-width: 100%; }
    .focus-select.active { background: var(--navy); border-color: var(--navy); color: var(--g); }
    .ed-focus { display: flex; flex-wrap: wrap; gap: .35rem .9rem; }
    .ed-focus label { display: flex; align-items: center; gap: .35rem; font-size: .84rem; color: var(--navy); cursor: pointer; }

    .skill-badge {
      font-size: .67rem; font-weight: 700; padding: .15rem .55rem;
      border-radius: 99px; text-transform: uppercase; letter-spacing: .06em;
      white-space: nowrap;
    }
    .skill-beginner     { background: #d4f5e9; color: #1a7f5a; }
    .skill-intermediate { background: #fef9c3; color: #927200; }
    .skill-advanced     { background: #fee2e2; color: #c0392b; }
    .vc-skill { border-radius: 99px; padding: .2rem .65rem; font-size: .75rem; font-weight: 700; }
    .vc-skill-beginner     { background: #d4f5e9; color: #1a7f5a; }
    .vc-skill-intermediate { background: #fef9c3; color: #927200; }
    .vc-skill-advanced     { background: #fee2e2; color: #c0392b; }

    .hs-badge {
      font-size: .62rem; font-weight: 800; letter-spacing: .05em; line-height: 1;
      background: #003366; color: #FFD700; padding: .22rem .4rem; border-radius: 5px; white-space: nowrap;
    }
    .card-top .hs-badge { margin-left: auto; }
    .ed-check { display: flex; align-items: center; gap: .55rem; font-size: .9rem; color: var(--navy); cursor: pointer; }
    .ed-check input { width: 1.1rem; height: 1.1rem; accent-color: #003366; }

    .age-chip {
      font-size: .67rem;
      font-weight: 700;
      color: var(--gray-500);
      background: var(--gray-100);
      padding: .15rem .55rem;
      border-radius: 99px;
      white-space: nowrap;
    }

    .card-name {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--navy);
      line-height: 1.25;
      display: flex;
      align-items: center;
      gap: .4rem;
    }
    .card-icon { font-size: 1.2rem; flex-shrink: 0; }

    .card-desc {
      font-size: .82rem;
      color: var(--gray-500);
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .equip-row {
      display: flex;
      flex-wrap: wrap;
      gap: .3rem;
    }
    .equip-tag {
      font-size: .68rem;
      color: var(--gray-500);
      background: var(--gray-100);
      padding: .1rem .5rem;
      border-radius: 99px;
    }

    .card-actions {
      display: flex;
      gap: .5rem;
      margin-top: auto;
      padding-top: .25rem;
    }
    .btn-watch {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .35rem;
      background: var(--g);
      color: var(--navy);
      font-weight: 700;
      font-size: .82rem;
      padding: .5rem .75rem;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      font-family: inherit;
      transition: background .15s;
    }
    .btn-watch:hover { background: #00e67a; }
    /* no video: still opens the drill — a quieter button, but clearly a button */
    .btn-watch.no-video { background: #e6eef7; color: #003366; cursor: pointer; }
    .btn-watch.no-video:hover { background: #003366; color: #fff; }

    .btn-plan {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .35rem;
      border: 2px solid var(--navy);
      color: var(--navy);
      font-weight: 700;
      font-size: .82rem;
      padding: .5rem .75rem;
      border-radius: var(--radius-sm);
      background: none;
      text-decoration: none;
      transition: all .15s;
      white-space: nowrap;
    }
    .btn-plan:hover { background: var(--navy); color: var(--g); }

    /* ── Video Modal ── */
    .vid-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.72);
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .vid-overlay.open { display: flex; }

    .vid-box {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 700px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .vid-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--gray-200);
      position: sticky;
      top: 0;
      background: var(--white);
      z-index: 1;
    }
    .vid-header-name {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--navy);
    }
    .vid-close {
      background: none;
      border: none;
      font-size: 1.15rem;
      color: var(--gray-400);
      cursor: pointer;
      padding: .2rem .5rem;
      border-radius: 6px;
      line-height: 1;
    }
    .vid-close:hover { background: var(--gray-100); }

    .vid-player-wrap {
      background: #000;
    }
    .vid-player-wrap video { display: block; width: 100%; max-height: 400px; }

    .vid-body {
      padding: 1.25rem;
    }
    .vid-chips {
      display: flex;
      gap: .4rem;
      flex-wrap: wrap;
      margin-bottom: .9rem;
    }
    .vid-chip {
      font-size: .72rem;
      font-weight: 700;
      padding: .2rem .65rem;
      border-radius: 99px;
    }
    .vc-cat { color: white; }
    .vc-age { background: var(--gray-100); color: var(--gray-600); }
    .vc-dur { background: var(--g-light); color: var(--g-dark); }

    .vid-desc {
      font-size: .88rem;
      color: var(--gray-500);
      line-height: 1.6;
      margin-bottom: 1rem;
    }
    .vid-coaching-title {
      font-size: .7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--gray-400);
      margin-bottom: .5rem;
    }
    .vid-coaching ul {
      margin: 0;
      padding-left: 1.2rem;
    }
    .vid-coaching li {
      font-size: .84rem;
      color: var(--gray-600);
      line-height: 1.55;
      margin-bottom: .25rem;
    }
    /* ── Drill sections in the view modal ── */
    .vid-foot { display: flex; justify-content: flex-end; padding: .75rem 1.25rem 1.1rem; border-top: 1px solid var(--gray-200); }
    .drill-sec { margin-top: 1.1rem; padding-top: 1rem; border-top: 1px solid var(--gray-200); }
    .drill-sec-title { font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .09em; color: var(--gray-400); margin-bottom: .5rem; }
    .drill-sec ul, .drill-sec ol { margin: 0; padding-left: 1.3rem; }
    .drill-sec ul { list-style: disc; }
    .drill-sec ol { list-style: decimal; }
    .drill-sec li { display: list-item; }
    .drill-sec li { font-size: .86rem; color: var(--gray-600); line-height: 1.6; margin-bottom: .3rem; }
    .drill-equip { font-size: .86rem; color: var(--gray-600); margin: 0; }
    .shuttle-table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    .shuttle-table th { padding: .35rem .6rem; text-align: left; border-bottom: 2px solid var(--gray-300); color: var(--gray-500); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; background: var(--gray-100); }
    .shuttle-table td { padding: .3rem .6rem; color: var(--gray-600); border-bottom: 1px solid var(--gray-200); }

    /* ── Messages, add button, toast ── */
    .lib-msg { grid-column: 1 / -1; text-align: center; color: var(--gray-500); padding: 2.5rem 1rem; font-size: .95rem; }
    .lib-msg-error { color: #b91c1c; }
    .link-btn { background: none; border: none; padding: 0; color: var(--blue); font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; }
    .lib-count-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .btn-add { background: var(--navy); color: var(--g); border: none; font: inherit; font-weight: 700; font-size: .83rem; padding: .5rem 1rem; border-radius: 99px; cursor: pointer; white-space: nowrap; }
    .btn-add:hover { background: #000; }
    .btn-edit { background: none; border: 2px solid var(--navy); color: var(--navy); font: inherit; font-weight: 700; font-size: .82rem; padding: .45rem 1rem; border-radius: var(--radius-sm); cursor: pointer; }
    .btn-edit:hover { background: var(--navy); color: var(--g); }
    .lib-toast { position: fixed; left: 50%; bottom: 1.5rem; transform: translate(-50%, 1rem); background: var(--navy); color: white; font-size: .88rem; font-weight: 700; padding: .65rem 1.2rem; border-radius: 99px; box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 400; max-width: calc(100vw - 2rem); }
    .lib-toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ── Edit form ── */
    .ed-body { padding: 1.1rem 1.25rem .25rem; display: grid; gap: .9rem; }
    .ed-row { display: grid; gap: .9rem; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .ed-row-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .ed-row-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    @media (max-width: 580px) { .ed-row, .ed-row-3, .ed-row-4 { grid-template-columns: minmax(0, 1fr); } }
    .ed-field { display: grid; gap: .3rem; min-width: 0; }
    .ed-field > span { font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--gray-500); }
    .ed-field small { font-size: .74rem; color: var(--gray-400); }
    .ed-field input, .ed-field select, .ed-field textarea { width: 100%; box-sizing: border-box; padding: .5rem .65rem; border: 2px solid var(--gray-300); border-radius: var(--radius-sm); font: inherit; font-size: .9rem; color: var(--navy); background: var(--white); }
    .ed-field textarea { resize: vertical; line-height: 1.5; }
    .ed-field input:focus, .ed-field select:focus, .ed-field textarea:focus { outline: none; border-color: var(--g-dark); }
    .ed-video { background: var(--gray-100); border-radius: var(--radius-sm); padding: .75rem .85rem; display: grid; gap: .6rem; }
    .ed-video-has { display: flex; align-items: center; justify-content: space-between; gap: .75rem; font-size: .86rem; color: var(--gray-600); overflow-wrap: anywhere; }
    .ed-msg { font-size: .86rem; font-weight: 700; color: var(--g-dark); min-height: 1.2em; }
    .ed-msg.is-error { color: #b91c1c; }
    .ed-foot { display: flex; align-items: center; gap: .6rem; padding: .9rem 1.25rem 1.1rem; position: sticky; bottom: 0; background: var(--white); border-top: 1px solid var(--gray-200); }
    .ed-foot .spacer { flex: 1; }
    .btn-save { background: var(--g); color: var(--navy); border: none; font: inherit; font-weight: 700; font-size: .88rem; padding: .55rem 1.2rem; border-radius: var(--radius-sm); cursor: pointer; }
    .btn-plain { background: none; border: 2px solid var(--gray-300); color: var(--gray-600); font: inherit; font-weight: 700; font-size: .85rem; padding: .5rem 1rem; border-radius: var(--radius-sm); cursor: pointer; }
    .btn-danger { background: none; border: none; color: #b91c1c; font: inherit; font-weight: 700; font-size: .85rem; cursor: pointer; padding: .5rem .25rem; }
    .btn-danger-solid { background: #b91c1c; color: white; border: none; font: inherit; font-weight: 700; font-size: .85rem; padding: .5rem 1rem; border-radius: var(--radius-sm); cursor: pointer; }
    button:disabled { opacity: .55; cursor: default; }
    .ed-confirm { margin: 0 1.25rem 1rem; padding: .85rem; border: 2px solid #fecaca; background: #fef2f2; border-radius: var(--radius-sm); font-size: .88rem; color: #7f1d1d; display: grid; gap: .6rem; }
    .ed-confirm[hidden], .ed-field[hidden], .ed-video-has[hidden], .ed-video-add[hidden] { display: none; }
    .ed-confirm div { display: flex; gap: .6rem; }
    .ed-video-add { display: grid; gap: .6rem; }
  </style>
</head>
<body>

<header>
  <div class="highlight-banner">
    <img src="images/INDEPENDENCE%20BDU_SHIELD_WHITE_small.png" alt="BDU Logo">
    <h1>Drill Library</h1>
  </div>
</header>

<div class="waffle-menu-toggle" onclick="toggleWaffleMenu()">
  <span></span><span></span><span></span>
</div>
<div id="waffleMenuContainer"></div>
<script>
  fetch('menus/waffle-menu.html')
    .then(r => r.text())
    .then(html => { document.getElementById('waffleMenuContainer').innerHTML = html; });
</script>

<div class="lib-hero">
  <div class="lib-hero-badge">The Indy Way</div>
  <h2>Drill Library — <span id="heroCount">Drills</span></h2>
  <p>Filter by category &nbsp;·&nbsp; open any drill for its video, setup and coaching points</p>
</div>

<div class="lib-controls">
  <div class="search-wrap">
    <input type="text" id="drillSearch" class="drill-search" placeholder="Search drills…" autocomplete="off" aria-label="Search drills">
    <button class="search-clear" id="searchClear" aria-label="Clear search">✕</button>
  </div>
  <div class="filter-pills" id="filterPills"></div>
  <div class="filter-pills age-pills" id="agePills" role="group" aria-label="Filter by age group"></div>
  <div class="lib-count-row">
    <div class="drill-count" id="drillCount"></div>
    <button type="button" class="btn-add" id="addDrillBtn">+ Add drill</button>
  </div>
</div>

<div class="drill-grid" id="drillGrid"></div>

<!-- Drill view -->
<div class="vid-overlay" id="vidOverlay">
  <div class="vid-box" role="dialog" aria-modal="true" aria-labelledby="vidName">
    <div class="vid-header">
      <div class="vid-header-name" id="vidName"></div>
      <button class="vid-close" id="vidClose" aria-label="Close">✕</button>
    </div>
    <div class="vid-player-wrap" id="vidPlayerWrap">
      <video id="vidPlayer" controls playsinline preload="metadata"></video>
    </div>
    <div class="vid-body">
      <div class="vid-chips" id="vidChips"></div>
      <div class="vid-desc" id="vidDesc"></div>
      <div class="focus-row" id="vidFocus" aria-label="Focus areas"></div>
      <div id="vidSections"></div>
    </div>
    <div class="vid-foot">
      <button type="button" class="btn-edit" id="editDrillBtn">✎ Edit drill</button>
    </div>
  </div>
</div>

<!-- Add / edit drill -->
<div class="vid-overlay" id="editOverlay">
  <form class="vid-box" id="editForm" role="dialog" aria-modal="true" aria-labelledby="editTitle" novalidate>
    <div class="vid-header">
      <div class="vid-header-name" id="editTitle">Edit drill</div>
      <button type="button" class="vid-close" id="editClose" aria-label="Close">✕</button>
    </div>
    <div class="ed-body">

        <label class="ed-field"><span>Category</span><select id="edCategory"></select></label>
        <label class="ed-field"><span>Youngest age</span><select id="edAge"></select></label>
        <label class="ed-field"><span>Oldest age</span><select id="edMaxAge"></select></label>

            <label class="ed-field"><span>Or paste a link to a video file</span><input id="edVideoLink" type="url" placeholder="https://…"></label>

      Delete this drill for every coach? This can't be undone.

        <button type="button" class="btn-plain" id="edKeep">Keep it</button>
        <button type="button" class="btn-danger-solid" id="edDeleteYes">Delete drill</button>

<script>

    .then(r => r.text())
    .then(html => { document.getElementById('shared-footer').innerHTML = html; });
</script>
<script src="scripts/scripts.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Drills live in Supabase (table bdu_drills — see indy-drills-setup.sql).
// Anyone can read them; saving, adding or deleting needs the coach PIN.
const CFG = {
  SUPABASE_URL:      'https://fpnmnlrwhwnuefbnehuf.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_NXTAP09deRk87WsP_KdyXg_e1k2Dsih',
};
const VIDEO_BUCKET = 'bdu-drill-videos';
const VIDEO_MAX_MB = 50;
const PIN_KEY = 'bdu_drill_pin';
const sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);

const CATEGORIES = ['All', 'Warmup', 'Fitness', 'Technical', 'Passing', 'Dribbling', 'Possession', 'Shooting', 'Tactical', 'Goalkeeping', 'Games', 'Scrimmage'];
// What a drill works on. One category, several focus areas — practice plans are built by focus area.
const FOCUS_AREAS = ['Warmup', 'Fun', 'Ball Mastery', 'Dribbling', '1v1', 'Aggression', 'Passing', 'First Touch', 'Combination Play', 'Possession', 'Numbers Up', 'Attacking', 'Finishing', 'Crossing', 'Heading', 'Defending', 'Pressing', 'Transition', 'Set Pieces', 'Goalkeeping', 'Small-Sided Game', 'Team Shape', 'Speed & Agility', 'Conditioning'];
const AGES = ['U8', 'U10', 'U12', 'U14', 'U16'];
const SKILLS = ['', 'Beginner', 'Intermediate', 'Advanced'];
const SECTIONS = [
  { key: 'setup',           label: 'Setup',           ordered: false },
  { key: 'directions',      label: 'Directions',      ordered: true  },
  { key: 'variations',      label: 'Variations',      ordered: false },
  { key: 'coaching_points', label: 'Coaching Points', ordered: false },
];

let DRILLS = [];
let activeFilter = 'All';
let activeFocus = 'All';
let activeAge = 'All';   // 'All', or an age group: shows the drills that group can run (youngest age at or below it)
let searchQuery = '';
let openId = null;      // drill shown in the view modal
let editing = null;     // drill in the edit form (null id = new)

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lines = text => String(text ?? '').split('\n').map(l => l.trim().replace(/^([-•*]|\d+[.)])\s+/, '')).filter(Boolean);
const videoSrc = d => d.video_url || (d.video_file ? (d.video_file.includes('/') ? d.video_file : `vid/${d.video_file}`) : '');
// A team can run a drill when its age is inside the drill's range (max_age empty = no upper limit)
const canRun = (drill, age) => age === 'All' || (AGES.indexOf(drill.min_age) <= AGES.indexOf(age) && (!drill.max_age || AGES.indexOf(age) <= AGES.indexOf(drill.max_age)));
const hasFocus = drill => activeFocus === 'All' || (drill.focus_areas || []).includes(activeFocus);
const ageLabel = d => d.max_age ? (d.max_age === d.min_age ? d.min_age : `${d.min_age}–${d.max_age}`) : `${d.min_age}+`;
const getPin = () => { try { return sessionStorage.getItem(PIN_KEY) || ''; } catch { return ''; } };
const setPin = pin => { try { pin ? sessionStorage.setItem(PIN_KEY, pin) : sessionStorage.removeItem(PIN_KEY); } catch { /* private mode */ } };

async function init() {
  const wanted = new URLSearchParams(location.search).get('age');
  if (AGES.includes(wanted)) activeAge = wanted;   // e.g. a link from the Player Pathway page
  wireModal();
  wireSearch();
  wireEditor();
  await loadDrills();
}

async function loadDrills() {
  const grid = $('drillGrid');
  grid.innerHTML = '<div class="lib-msg">Loading drills…</div>';
  const { data, error } = await sb.from('bdu_drills').select('*').order('sort_order').order('name');
  if (error) {
    grid.innerHTML = `<div class="lib-msg lib-msg-error">The drill library couldn't load. Check your connection and
      <button type="button" class="link-btn" id="retryLoad">try again</button>.</div>`;
    $('retryLoad').addEventListener('click', loadDrills);
    $('drillCount').textContent = '';
    return;
  }
  DRILLS = data || [];
  render();
}

function render() {
  $('heroCount').textContent = `${DRILLS.length} Drill${DRILLS.length !== 1 ? 's' : ''}`;
  buildFilterPills();
  buildAgePills();
  buildCards();
  filterCards();
}

function buildFilterPills() {
  const container = $('filterPills');
  container.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const count = DRILLS.filter(d => (cat === 'All' || d.category === cat) && canRun(d, activeAge) && hasFocus(d)).length;
    const btn = document.createElement('button');
    btn.className = 'filter-pill' + (cat === activeFilter ? ' active' : '');
    btn.textContent = `${cat} (${count})`;
    btn.addEventListener('click', () => { activeFilter = cat; buildFilterPills(); buildAgePills(); filterCards(); });
    container.appendChild(btn);
  });
}

function buildAgePills() {
  const container = $('agePills');
  container.innerHTML = '<span class="pill-label">Age</span>';
  ['All', ...AGES].forEach(age => {
    const count = DRILLS.filter(d => canRun(d, age) && hasFocus(d) && (activeFilter === 'All' || d.category === activeFilter)).length;
    const btn = document.createElement('button');
    btn.className = 'filter-pill' + (age === activeAge ? ' active' : '');
    btn.textContent = `${age === 'All' ? 'All ages' : age} (${count})`;
    btn.setAttribute('aria-pressed', age === activeAge ? 'true' : 'false');
    btn.addEventListener('click', () => { activeAge = age; buildFilterPills(); buildAgePills(); filterCards(); });
    container.appendChild(btn);
  });
  // Focus area: one select (there are too many for pills)
  const used = FOCUS_AREAS.filter(f => DRILLS.some(d => (d.focus_areas || []).includes(f)));
  if (!used.length) return;
  const sel = document.createElement('select');
  sel.className = 'focus-select' + (activeFocus === 'All' ? '' : ' active');
  sel.setAttribute('aria-label', 'Filter by focus area');
  sel.innerHTML = '<option value="All">Focus: all</option>' + used.map(f => {
    const n = DRILLS.filter(d => (d.focus_areas || []).includes(f) && canRun(d, activeAge) && (activeFilter === 'All' || d.category === activeFilter)).length;
    return `<option value="${esc(f)}"${f === activeFocus ? ' selected' : ''}>${esc(f)} (${n})</option>`;
  }).join('');
  sel.addEventListener('change', () => { activeFocus = sel.value; buildFilterPills(); buildAgePills(); filterCards(); });
  container.appendChild(sel);
}

function buildCards() {
  const grid = $('drillGrid');
  grid.innerHTML = '';
  if (!DRILLS.length) {
    grid.innerHTML = '<div class="lib-msg">No drills yet. Tap “+ Add drill” to make the first one.</div>';
    return;
  }
  DRILLS.forEach(drill => {
    const card = document.createElement('div');
    card.className = 'drill-card';
    card.dataset.id = drill.id;
    const hasVideo = !!videoSrc(drill);
    card.innerHTML = `
      <div class="card-top">
        <span class="cat-badge cat-${esc(drill.category)}">${esc(drill.category)}</span>
        <span class="age-chip">${esc(ageLabel(drill))}</span>
        ${drill.skill_level ? `<span class="skill-badge skill-${esc(drill.skill_level.toLowerCase())}">${esc(drill.skill_level)}</span>` : ''}
        ${drill.from_hs ? '<span class="hs-badge" title="From the high school program">HS</span>' : ''}
      </div>
      <div class="card-name"><span class="card-icon">${esc(drill.icon)}</span>${esc(drill.name)}</div>
      <div class="card-desc">${esc(drill.description)}</div>
      <div class="equip-row">${(drill.equipment || []).map(e => `<span class="equip-tag">${esc(e)}</span>`).join('')}</div>
      <div class="card-actions">
        <button type="button" class="btn-watch${hasVideo ? '' : ' no-video'}">${hasVideo ? '▶ Watch & read' : '📋 View drill'}</button>
        <a class="btn-plan" href="indy-practice-builder.html">→ Build Plan</a>
      </div>`;
    card.querySelector('.btn-watch').addEventListener('click', () => openModal(drill.id));
    grid.appendChild(card);
  });
}

function filterCards() {
  const q = searchQuery.trim().toLowerCase();
  const text = d => [d.name, d.description, d.category, d.players, ...(d.equipment || []), ...(d.focus_areas || []),
    ...SECTIONS.flatMap(s => d[s.key] || [])].join(' ').toLowerCase();
  document.querySelectorAll('.drill-card').forEach(card => {
    const drill = DRILLS.find(d => d.id === card.dataset.id);
    const matchCat = activeFilter === 'All' || drill.category === activeFilter;
    card.classList.toggle('hidden', !(matchCat && canRun(drill, activeAge) && hasFocus(drill) && (!q || text(drill).includes(q))));
  });
  const visible = document.querySelectorAll('.drill-card:not(.hidden)').length;
  const own = activeAge === 'All' ? 0 : [...document.querySelectorAll('.drill-card:not(.hidden)')]
    .filter(c => DRILLS.find(d => d.id === c.dataset.id).min_age === activeAge).length;
  $('drillCount').textContent = !DRILLS.length ? ''
    : activeAge === 'All' ? `Showing ${visible} drill${visible !== 1 ? 's' : ''}`
    : `Showing ${visible} drill${visible !== 1 ? 's' : ''} a ${activeAge} team can run · ${own} start at ${activeAge}`;
}

function wireSearch() {
  const input = $('drillSearch');
  const clearBtn = $('searchClear');
  input.addEventListener('input', () => {
    searchQuery = input.value;
    clearBtn.classList.toggle('visible', searchQuery.length > 0);
    filterCards();
  });
  clearBtn.addEventListener('click', () => {
    input.value = ''; searchQuery = '';
    clearBtn.classList.remove('visible');
    filterCards();
    input.focus();
  });
}

// ── View modal ──
function wireModal() {
  $('vidClose').addEventListener('click', closeModal);
  $('vidOverlay').addEventListener('click', e => { if (e.target === $('vidOverlay')) closeModal(); });
  $('editDrillBtn').addEventListener('click', () => { const d = DRILLS.find(x => x.id === openId); closeModal(); openEditor(d); });
  $('addDrillBtn').addEventListener('click', () => openEditor(null));
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if ($('editOverlay').classList.contains('open')) closeEditor();
    else if ($('vidOverlay').classList.contains('open')) closeModal();
  });
}

function openModal(id) {
  const drill = DRILLS.find(d => d.id === id);
  if (!drill) return;
  openId = id;
  const src = videoSrc(drill);
  $('vidPlayerWrap').style.display = src ? '' : 'none';
  $('vidPlayer').src = src;
  $('vidName').textContent = `${drill.icon} ${drill.name}`;
  $('vidChips').innerHTML = `
    <span class="vid-chip vc-cat cat-${esc(drill.category)}">${esc(drill.category)}</span>
    <span class="vid-chip vc-age">${esc(ageLabel(drill))}</span>
    <span class="vid-chip vc-dur">${esc(drill.duration)} min</span>
    ${drill.players ? `<span class="vid-chip vc-age">${esc(drill.players)}</span>` : ''}
    ${drill.skill_level ? `<span class="vid-chip vc-skill vc-skill-${esc(drill.skill_level.toLowerCase())}">${esc(drill.skill_level)}</span>` : ''}
    ${drill.from_hs ? '<span class="vid-chip hs-badge" title="From the high school program">HS · High school program</span>' : ''}`;
  $('vidDesc').textContent = drill.description;
  $('vidFocus').innerHTML = (drill.focus_areas || []).map(f => `<span class="focus-tag">${esc(f)}</span>`).join('');

  let html = SECTIONS.filter(s => (drill[s.key] || []).length).map(s => {
    const tag = s.ordered ? 'ol' : 'ul';
    return `<div class="drill-sec"><div class="drill-sec-title">${s.label}</div>
      <${tag}>${drill[s.key].map(i => `<li>${esc(i)}</li>`).join('')}</${tag}></div>`;
  }).join('');
  const shuttle = drill.extra && drill.extra.shuttleData;
  if (shuttle && shuttle.length) {
    html += `<div class="drill-sec"><div class="drill-sec-title">Shuttle Reference Table</div>
      <div style="overflow-x:auto;"><table class="shuttle-table"><thead><tr><th>Level</th><th>Speed (km/h)</th><th>Sec / 20m</th><th>Shuttles</th></tr></thead>
      <tbody>${shuttle.map(l => `<tr><td>${esc(l.level)}</td><td>${esc(l.kmh)}</td><td>${esc(l.secPerLap)}</td><td>${esc(l.shuttles)}</td></tr>`).join('')}</tbody></table></div></div>`;
  }
  if ((drill.equipment || []).length) {
    html += `<div class="drill-sec"><div class="drill-sec-title">Equipment</div><p class="drill-equip">${esc(drill.equipment.join(', '))}</p></div>`;
  }
  $('vidSections').innerHTML = html;
  $('vidOverlay').classList.add('open');
}

function closeModal() {
  const player = $('vidPlayer');
  player.pause();
  player.removeAttribute('src');
  player.load();
  $('vidOverlay').classList.remove('open');
}

// ── Edit / add ──
function wireEditor() {
  $('edCategory').innerHTML = CATEGORIES.slice(1).map(c => `<option>${c}</option>`).join('');
  $('edAge').innerHTML = AGES.map(a => `<option value="${a}">${a}</option>`).join('');
  $('edMaxAge').innerHTML = '<option value="">No upper limit</option>' + AGES.map(a => `<option value="${a}">${a}</option>`).join('');
  $('edFocus').innerHTML = FOCUS_AREAS.map(f => `<label><input type="checkbox" value="${esc(f)}"> ${esc(f)}</label>`).join('');
  $('edSkill').innerHTML = SKILLS.map(s => `<option value="${s}">${s || 'Not set'}</option>`).join('');
  $('editClose').addEventListener('click', closeEditor);
  $('edCancel').addEventListener('click', closeEditor);
  $('editForm').addEventListener('submit', saveDrill);
  $('edDelete').addEventListener('click', () => { $('edDeleteConfirm').hidden = false; $('edKeep').focus(); });
  $('edKeep').addEventListener('click', () => { $('edDeleteConfirm').hidden = true; });
  $('edDeleteYes').addEventListener('click', deleteDrill);
  $('edRemoveVideo').addEventListener('click', () => { editing.removeVideo = true; showVideoField(); });
}

function openEditor(drill) {
  editing = { id: drill ? drill.id : null, drill: drill || {}, removeVideo: false };
  const d = editing.drill;
  $('editTitle').textContent = drill ? 'Edit drill' : 'Add drill';
  $('edName').value = d.name || '';
  $('edIcon').value = d.icon || '⚽';
  $('edCategory').value = d.category || 'Technical';
  $('edAge').value = d.min_age || 'U10';
  $('edMaxAge').value = d.max_age || '';
  $('edFocus').querySelectorAll('input').forEach(c => { c.checked = (d.focus_areas || []).includes(c.value); });
  $('edSkill').value = d.skill_level || '';
  $('edDuration').value = d.duration || 15;
  $('edPlayers').value = d.players || '';
  $('edDesc').value = d.description || '';
  $('edFromHs').checked = !!d.from_hs;
  SECTIONS.forEach(s => { $('ed_' + s.key).value = (d[s.key] || []).join('\n'); });
  $('edEquipment').value = (d.equipment || []).join(', ');
  $('edVideoFile').value = '';
  $('edVideoLink').value = '';
  $('edPin').value = '';
  $('edPinRow').hidden = !!getPin();
  $('edDelete').hidden = !drill;
  $('edDeleteConfirm').hidden = true;
  showVideoField();
  setEditMsg('');
  $('editOverlay').classList.add('open');
  $('edName').focus();
}

// A drill that already has a video keeps it; one without can get an upload or a link.
function showVideoField() {
  const d = editing.drill;
  const has = !editing.removeVideo && !!videoSrc(d);
  $('edVideoHas').hidden = !has;
  $('edVideoAdd').hidden = has;
  if (has) $('edVideoName').textContent = d.video_file || 'Uploaded video';
}

function closeEditor() { $('editOverlay').classList.remove('open'); editing = null; }
function setEditMsg(text, isError) {
  const el = $('edMsg');
  el.textContent = text;
  el.className = 'ed-msg' + (isError ? ' is-error' : '');
}
function busy(on) {
  ['edSave', 'edCancel', 'edDelete', 'edDeleteYes'].forEach(id => { $(id).disabled = on; });
  $('edSave').textContent = on ? 'Saving…' : 'Save drill';
}

// The PIN typed in the form (or the one already unlocked this visit), checked by the database.
async function readyPin() {
  const pin = getPin() || $('edPin').value.trim();
  if (!pin) { setEditMsg('Enter the coach PIN to save changes.', true); $('edPinRow').hidden = false; $('edPin').focus(); return null; }
  const { data, error } = await sb.rpc('bdu_drill_pin_ok', { p_pin: pin });
  if (error) { setEditMsg("Couldn't check the PIN. Check your connection and try again.", true); return null; }
  if (!data) { setPin(''); $('edPinRow').hidden = false; setEditMsg("That PIN isn't right.", true); $('edPin').focus(); return null; }
  setPin(pin);
  return pin;
}

async function saveDrill(e) {
  e.preventDefault();
  const d = editing.drill;
  const name = $('edName').value.trim();
  const duration = parseInt($('edDuration').value, 10);
  const link = $('edVideoLink').value.trim();
  const file = $('edVideoFile').files[0];
  if (!name) { setEditMsg('Give the drill a name.', true); $('edName').focus(); return; }
  if ($('edMaxAge').value && AGES.indexOf($('edMaxAge').value) < AGES.indexOf($('edAge').value)) { setEditMsg('The oldest age can\'t be younger than the youngest age.', true); return; }
  if (!(duration >= 1 && duration <= 180)) { setEditMsg('Minutes must be between 1 and 180.', true); $('edDuration').focus(); return; }
  const adding = !$('edVideoAdd').hidden;
  if (adding && link && !/^https:\/\/\S+$/.test(link)) { setEditMsg('The video link must start with https://', true); return; }
  if (adding && file) {
    if (!/^video\/(mp4|webm|quicktime)$/.test(file.type)) { setEditMsg('Use an MP4, WebM or MOV video.', true); return; }
    if (file.size > VIDEO_MAX_MB * 1024 * 1024) { setEditMsg(`Videos can be up to ${VIDEO_MAX_MB} MB.`, true); return; }
  }

  busy(true);
  setEditMsg('');
  try {
    const pin = await readyPin();
    if (!pin) return;

    let video_file = editing.removeVideo ? null : (d.video_file || null);
    let video_url  = editing.removeVideo ? null : (d.video_url || null);
    if (adding && file) {
      setEditMsg('Uploading the video…');
      const ext = (file.name.split('.').pop() || 'mp4').toLowerCase().replace(/[^a-z0-9]/g, '');
      const path = `${Date.now()}-${Math.random().toString(36).slice(2, 10)}.${ext}`;
      const up = await sb.storage.from(VIDEO_BUCKET).upload(path, file, { contentType: file.type });
      if (up.error) { setEditMsg("The video didn't upload. Nothing was saved — try again.", true); return; }
      video_url = sb.storage.from(VIDEO_BUCKET).getPublicUrl(path).data.publicUrl;
      video_file = null;
    } else if (adding && link) {
      video_url = link; video_file = null;
    }

    const payload = {
      id: editing.id, name, icon: $('edIcon').value.trim(), category: $('edCategory').value,
      skill_level: $('edSkill').value, min_age: $('edAge').value, duration,
      players: $('edPlayers').value.trim(), description: $('edDesc').value.trim(),
      equipment: $('edEquipment').value.split(',').map(s => s.trim()).filter(Boolean),
      video_file, video_url, from_hs: $('edFromHs').checked,
      max_age: $('edMaxAge').value, focus_areas: [...$('edFocus').querySelectorAll('input:checked')].map(c => c.value),
    };
    SECTIONS.forEach(s => { payload[s.key] = lines($('ed_' + s.key).value); });

    const { data, error } = await sb.rpc('bdu_drill_save', { p_pin: pin, p_drill: payload });
    if (error) { setEditMsg("The drill didn't save. Check your connection and try again.", true); return; }
    const saved = Array.isArray(data) ? data[0] : data;
    const i = DRILLS.findIndex(x => x.id === saved.id);
    if (i >= 0) DRILLS[i] = saved; else DRILLS.push(saved);
    closeEditor();
    render();
    toast(`Saved “${saved.name}”`);
    openModal(saved.id);
  } finally {
    busy(false);
  }
}

async function deleteDrill() {
  busy(true);
  try {
    const pin = await readyPin();
    if (!pin) return;
    const gone = editing.drill;
    const { error } = await sb.rpc('bdu_drill_delete', { p_pin: pin, p_id: gone.id });
    if (error) { setEditMsg("The drill wasn't deleted. Check your connection and try again.", true); return; }
    DRILLS = DRILLS.filter(x => x.id !== gone.id);
    closeEditor();
    render();
    toast(`Deleted “${gone.name}”`);
  } finally {
    busy(false);
  }
}

let toastTimer;
function toast(text) {
  const el = $('libToast');
  el.textContent = '✓ ' + text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 4000);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
