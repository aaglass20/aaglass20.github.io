<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Plans — The Indy Way — BDU Soccer</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    :root {
      --navy: #003366;
      --green: #00ff88;
      --white: #ffffff;
      --gray-100: #f7fafc;
      --gray-200: #e2e8f0;
      --gray-400: #a0aec0;
      --gray-500: #718096;
      --gray-700: #4a5568;
      --dark: #1a1a2e;
      --radius: 16px;
      --radius-sm: 8px;
    }

    /* ── Hero ── */
    .sp-hero {
      text-align: center;
      padding: 3rem 1.5rem 2.5rem;
      background: linear-gradient(135deg, #003366 0%, #0779e4 100%);
      color: white;
      position: relative;
      overflow: hidden;
    }
    .sp-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 70% 50%, rgba(0,255,136,.18) 0%, transparent 60%);
      pointer-events: none;
    }
    .sp-hero-badge {
      display: inline-block;
      background: rgba(0,255,136,.15);
      border: 1px solid rgba(0,255,136,.4);
      color: #00ff88;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: .35rem 1rem;
      border-radius: 99px;
      margin-bottom: 1rem;
      position: relative;
      z-index: 1;
    }
    .sp-hero h1 {
      font-family: 'Rajdhani', sans-serif;
      font-size: clamp(1.8rem, 4.5vw, 3rem);
      font-weight: 700;
      margin: 0 0 .75rem;
      position: relative;
      z-index: 1;
    }
    .sp-hero h1 span { color: #00ff88; }
    .sp-hero p {
      font-size: 1rem;
      opacity: .85;
      max-width: 520px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
      line-height: 1.6;
    }
    .sp-hero-back {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      color: rgba(255,255,255,.7);
      font-size: .82rem;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 1.25rem;
      position: relative;
      z-index: 1;
      transition: color .15s;
    }
    .sp-hero-back:hover { color: #fff; }

    /* ── Toolbar ── */
    .sp-toolbar {
      max-width: 1000px;
      margin: 0 auto;
      padding: 1.75rem 1.5rem 1rem;
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .sp-search-wrap {
      flex: 1;
      min-width: 220px;
      position: relative;
    }
    .sp-search-wrap i {
      position: absolute;
      left: .9rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-400);
      font-size: .88rem;
    }
    .sp-search {
      width: 100%;
      box-sizing: border-box;
      padding: .6rem .9rem .6rem 2.4rem;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-size: .9rem;
      font-family: inherit;
      outline: none;
      transition: border-color .15s;
    }
    .sp-search:focus { border-color: var(--navy); }

    .sp-filters {
      display: flex;
      gap: .4rem;
      flex-wrap: wrap;
    }
    .sp-filter-btn {
      padding: .32rem .8rem;
      border-radius: 99px;
      border: 2px solid var(--gray-200);
      background: var(--white);
      font-size: .78rem;
      font-weight: 700;
      color: var(--gray-500);
      cursor: pointer;
      font-family: inherit;
      transition: all .15s;
    }
    .sp-filter-btn.active,
    .sp-filter-btn:hover {
      background: var(--navy);
      border-color: var(--navy);
      color: #fff;
    }

    /* ── Plan count ── */
    .sp-count {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 1.5rem .75rem;
      font-size: .82rem;
      color: var(--gray-400);
      font-weight: 600;
    }

    /* ── Grid ── */
    .sp-grid {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .sp-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1rem;
      color: var(--gray-400);
      font-size: .95rem;
    }
    .sp-empty i { font-size: 2rem; margin-bottom: .75rem; display: block; }

    /* ── Plan card ── */
    .plan-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: 0 4px 20px rgba(0,0,0,.07);
      border-top: 5px solid var(--green);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform .2s, box-shadow .2s;
    }
    .plan-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(0,0,0,.11);
    }
    .plan-card-body { padding: 1.5rem 1.5rem 1rem; flex: 1; }

    .plan-card-name {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--dark);
      margin: 0 0 .6rem;
    }

    .plan-meta {
      display: flex;
      gap: .45rem;
      flex-wrap: wrap;
      margin-bottom: .85rem;
    }
    .plan-chip {
      font-size: .72rem;
      font-weight: 700;
      padding: .15rem .6rem;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .chip-age  { background: #dbeafe; color: #1d4ed8; }
    .chip-dur  { background: #f3f4f6; color: #374151; }
    .chip-fit  { background: #d1fae5; color: #065f46; }
    .chip-tac  { background: #fef3c7; color: #92400e; }
    .chip-tech { background: #dbeafe; color: #1e40af; }
    .chip-pass { background: #d1fae5; color: #065f46; }
    .chip-poss { background: #e0f2fe; color: #0369a1; }
    .chip-shot { background: #fee2e2; color: #991b1b; }
    .chip-game { background: #ffedd5; color: #9a3412; }
    .chip-warm { background: #fef9c3; color: #854d0e; }

    .plan-desc {
      font-size: .88rem;
      color: var(--gray-500);
      line-height: 1.6;
      margin-bottom: 1.1rem;
    }

    /* Block timeline mini-preview */
    .plan-timeline {
      display: flex;
      gap: .3rem;
      flex-wrap: wrap;
      margin-bottom: .9rem;
    }
    .ptl-block {
      display: flex;
      align-items: center;
      gap: .25rem;
      font-size: .75rem;
      background: var(--gray-100);
      border-radius: 6px;
      padding: .22rem .5rem;
      color: var(--gray-700);
    }
    .ptl-block.ptl-warmup  { background: #fef9c3; color: #854d0e; }
    .ptl-block.ptl-drill   { background: #dbeafe; color: #1d4ed8; }
    .ptl-block.ptl-break   { background: #e0f7fa; color: #00695c; }
    .ptl-block.ptl-closing { background: #f3e8ff; color: #6b21a8; }

    .plan-stats {
      font-size: .78rem;
      color: var(--gray-400);
      margin-bottom: .25rem;
    }

    .plan-card-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--gray-200);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
    }
    .plan-author {
      font-size: .75rem;
      color: var(--gray-400);
    }
    .btn-load-plan {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      background: var(--navy);
      color: #fff;
      font-size: .85rem;
      font-weight: 700;
      padding: .55rem 1.1rem;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      font-family: inherit;
      transition: background .15s, transform .1s;
      text-decoration: none;
    }
    .btn-load-plan:hover { background: #002244; transform: scale(1.03); }
    .btn-load-plan i { font-size: .78rem; }
  </style>
</head>

<header>

    <h1>Saved Plans</h1>

</header>

<div class="waffle-menu-toggle" onclick="toggleWaffleMenu()">

// ══════════════════════════════════════════════
//  FOCUS CHIP CONFIG
// ══════════════════════════════════════════════

const FOCUS_CHIP_CLASS = {
  Fitness:    'chip-fit',
  Tactical:   'chip-tac',
  Technical:  'chip-tech',
  Passing:    'chip-pass',
  Possession: 'chip-poss',
  Shooting:   'chip-shot',
  Dribbling:  'chip-tech',
  Games:      'chip-game',
  Warmup:     'chip-warm',
};

// ══════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════

const AGE_FILTERS = ['All', 'U8', 'U10', 'U12', 'U14', 'U16', 'Mixed'];
let activeAge = 'All';

function buildFilters() {
  const row = document.getElementById('filterRow');
  AGE_FILTERS.forEach(age => {
    const btn = document.createElement('button');
    btn.className = 'sp-filter-btn' + (age === 'All' ? ' active' : '');
    btn.textContent = age;
    btn.addEventListener('click', () => {
      document.querySelectorAll('.sp-filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeAge = age;
      renderGrid();
    });
    row.appendChild(btn);
  });
}

function getFilteredPlans() {
  const q = document.getElementById('planSearch').value.toLowerCase().trim();
  return SAVED_PLANS.filter(p => {
    if (activeAge !== 'All' && p.ageGroup !== activeAge) return false;
    if (q && !p.name.toLowerCase().includes(q) && !p.description.toLowerCase().includes(q) && !p.focus.some(f => f.toLowerCase().includes(q))) return false;
    return true;
  });
}

function blockSummary(plan) {
  const counts = { warmup: 0, drill: 0, break: 0, closing: 0 };
  plan.forEach(b => { if (counts[b.type] !== undefined) counts[b.type]++; });
  return Object.entries(counts)
    .filter(([,v]) => v > 0)
    .map(([k, v]) => `${v} ${k}${v > 1 ? (k === 'closing' ? 's' : 's') : ''}`)
    .join(' · ');
}

function renderPlanCard(plan) {
  const card = document.createElement('div');
  card.className = 'plan-card';

  const focusTags = plan.focus.map(f =>
    `<span class="plan-chip ${FOCUS_CHIP_CLASS[f] || 'chip-tech'}">${f}</span>`
  ).join('');

  const timelineBlocks = plan.state.plan.map(b =>
    `<span class="ptl-block ptl-${b.type}">${b.icon} ${b.duration}m</span>`
  ).join('');

  const summary = blockSummary(plan.state.plan);

  card.innerHTML = `
    <div class="plan-card-body">
      <div class="plan-card-name">${plan.name}</div>
      <div class="plan-meta">
        <span class="plan-chip chip-age">${plan.ageGroup}</span>
        <span class="plan-chip chip-dur">${plan.duration} min</span>
        ${focusTags}
      </div>
      <div class="plan-desc">${plan.description}</div>
      <div class="plan-timeline">${timelineBlocks}</div>
      <div class="plan-stats">${summary}</div>
    </div>
    <div class="plan-card-footer">
      <span class="plan-author"><i class="fas fa-user-shield" style="margin-right:.3rem;color:var(--gray-400)"></i>${plan.author}</span>
      <button class="btn-load-plan" onclick="loadPlan('${plan.id}')">
        <i class="fas fa-arrow-right"></i> Load Plan
      </button>
    </div>
  `;

  return card;
}

function renderGrid() {
  const grid = document.getElementById('planGrid');
  const plans = getFilteredPlans();

  document.getElementById('planCount').textContent = `${plans.length} plan${plans.length !== 1 ? 's' : ''}`;

  grid.innerHTML = '';
  if (!plans.length) {
    grid.innerHTML = `<div class="sp-empty"><i class="fas fa-clipboard"></i>No plans match your search.</div>`;
    return;
  }
  plans.forEach(p => grid.appendChild(renderPlanCard(p)));
}

// ══════════════════════════════════════════════
//  LOAD PLAN
// ══════════════════════════════════════════════

function loadPlan(planId) {
  const plan = SAVED_PLANS.find(p => p.id === planId);
  if (!plan) return;
  localStorage.setItem('bdu_indy_plan_v1', JSON.stringify(plan.state));
  window.location.href = 'indy-practice-builder.html';
}

function filterPlans() {
  renderGrid();
}
