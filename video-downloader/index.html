<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Downloader</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #64748b;
      font-size: 0.875rem;
      margin-bottom: 36px;
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: #1e2130;
      border: 1px solid #2d3348;
      border-radius: 14px;
      padding: 28px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    input[type="text"] {
      width: 100%;
      background: #0f1117;
      border: 1px solid #2d3348;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.95rem;
      color: #e2e8f0;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus {
      border-color: #6366f1;
    }

    input[type="text"]::placeholder { color: #475569; }

    .field { margin-bottom: 18px; }
    .field:last-of-type { margin-bottom: 24px; }

    .hint {
      font-size: 0.75rem;
      color: #475569;
      margin-top: 5px;
    }

    button {
      width: 100%;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    button:hover:not(:disabled) { background: #4f46e5; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #progress-wrap {
      display: none;
      margin-top: 22px;
    }

    #log {
      background: #0a0d14;
      border: 1px solid #2d3348;
      border-radius: 8px;
      padding: 14px;
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 0.72rem;
      line-height: 1.6;
      color: #94a3b8;
      max-height: 260px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .log-success { color: #4ade80; font-weight: 700; }
    .log-error   { color: #f87171; font-weight: 700; }

    #status-banner {
      display: none;
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      text-align: center;
    }

    #status-banner.success { background: #14532d; color: #4ade80; }
    #status-banner.error   { background: #450a0a; color: #f87171; }

    /* downloaded files list */
    #files-section {
      width: 100%;
      max-width: 560px;
      margin-top: 28px;
    }

    #files-section h2 {
      font-size: 0.8rem;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }

    #file-list {
      list-style: none;
    }

    #file-list li {
      background: #1e2130;
      border: 1px solid #2d3348;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 6px;
      font-size: 0.875rem;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #file-list li::before { content: "▶"; color: #6366f1; font-size: 0.7rem; }
    #file-list.empty { color: #475569; font-size: 0.85rem; }
  </style>
</head>
<body>

  <h1>Video Downloader</h1>
  <p class="subtitle">TikTok · Instagram · Facebook</p>

  <div class="card">
    <div class="field">
      <label for="url">Video URL</label>
      <input id="url" type="text" placeholder="https://www.tiktok.com/@user/video/..." autocomplete="off">
    </div>

    <div class="field">
      <label for="name">File Name <span style="font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label>
      <input id="name" type="text" placeholder="my-video">
      <p class="hint">Leave blank to use the video's title. No extension needed.</p>
    </div>

    <button id="btn" onclick="startDownload()">Download</button>

    <div id="progress-wrap">
      <div id="log"></div>
      <div id="status-banner"></div>
    </div>
  </div>

  <div id="files-section">
    <h2>Downloaded Files</h2>
    <ul id="file-list"></ul>
  </div>

  <script>
    async function startDownload() {
      const url  = document.getElementById('url').value.trim();
      const name = document.getElementById('name').value.trim();
      const btn  = document.getElementById('btn');
      const log  = document.getElementById('log');
      const wrap = document.getElementById('progress-wrap');
      const banner = document.getElementById('status-banner');

      if (!url) {
        document.getElementById('url').focus();
        return;
      }

      // reset UI
      log.innerHTML = '';
      banner.style.display = 'none';
      banner.className = '';
      wrap.style.display = 'block';
      btn.disabled = true;
      btn.textContent = 'Downloading…';

      function appendLine(text, cls = '') {
        const span = document.createElement('span');
        if (cls) span.className = cls;
        span.textContent = text + '\n';
        log.appendChild(span);
        log.scrollTop = log.scrollHeight;
      }

      try {
        const res = await fetch('/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, name }),
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const events = buffer.split('\n\n');
          buffer = events.pop();

          for (const event of events) {
            if (!event.startsWith('data: ')) continue;
            let data;
            try { data = JSON.parse(event.slice(6)); } catch { continue; }

            if (data.line) {
              appendLine(data.line);
            } else if (data.done) {
              appendLine('✓ Download complete!', 'log-success');
              showBanner('Download complete!', 'success');
              document.getElementById('url').value = '';
              document.getElementById('name').value = '';
              loadFiles();
            } else if (data.error) {
              appendLine('✗ ' + data.error, 'log-error');
              showBanner(data.error, 'error');
            }
          }
        }
      } catch (e) {
        appendLine('✗ ' + e.message, 'log-error');
        showBanner(e.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Download';
      }
    }

    function showBanner(msg, type) {
      const b = document.getElementById('status-banner');
      b.textContent = type === 'success' ? '✓ ' + msg : '✗ ' + msg;
      b.className = type;
      b.style.display = 'block';
    }

    async function loadFiles() {
      try {
        const files = await fetch('/files').then(r => r.json());
        const ul = document.getElementById('file-list');
        ul.innerHTML = '';
        if (files.length === 0) {
          ul.innerHTML = '<li style="background:none;border:none;color:#475569">No files yet.</li>';
          return;
        }
        files.forEach(f => {
          const li = document.createElement('li');
          li.textContent = f;
          ul.appendChild(li);
        });
      } catch { /* server not ready yet */ }
    }

    // allow Enter key in inputs
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') startDownload();
    });

    loadFiles();
  </script>
</body>
</html>
